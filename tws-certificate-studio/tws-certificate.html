              <div style={{fontSize:9,color:'var(--tx3)',marginTop:4,lineHeight:1.5}}>Toggle "Per-Cert" above: OFF = one fixed image on every certificate (e.g. seal/logo). ON = you upload a different photo for each teacher in the Create step.</div>
            </div>
          </div>)}

          {selected==='__qr__' && (<div className="dz-sec">
            <div className="dz-sec-hdr">▦ QR Verification Code</div>
            <div className="dz-sec-body">
              <div className="sld-row"><span className="sld-lbl">Show</span><label className="tog"><input type="checkbox" checked={certType.qr?.show!==false} onChange={e=>updateQr({show:e.target.checked})}/><span className="tog-sl"/></label></div>
              <span className="f-lbl">Corner</span>
              <select className="f-select" value={certType.qr?.position||'bottom-right'} onChange={e=>updateQr({position:e.target.value})}>
                <option value="bottom-right">Bottom Right</option>
                <option value="bottom-left">Bottom Left</option>
                <option value="top-right">Top Right</option>
                <option value="top-left">Top Left</option>
              </select>
              <SliderRow label="Size" val={certType.qr?.size||70} min={30} max={180} onChange={v=>updateQr({size:v})} unit="px"/>
              <XY x={certType.qr?.x||0} y={certType.qr?.y||0} onX={v=>updateQr({x:v})} onY={v=>updateQr({y:v})} min={-800} max={800} onReset={()=>updateQr({x:0,y:0})}/>
              <div style={{fontSize:9,color:'var(--tx3)',marginTop:4,lineHeight:1.5}}>Move the QR block up / down / left / right using the sliders or arrow buttons above — position is saved with this certificate type. Once your verify worker.js is live, paste its URL into CERT_WORKER_CONFIG.url and this QR will point there automatically.</div>
            </div>
          </div>)}
        </div>
      </div>
      {showImport && <ImportLabelsModal currentType={certType} otherTypes={(certTypes||[]).filter(c=>c.id!==certType.id)} allTypes={certTypes||[]} onClose={()=>setShowImport(false)} onImport={(newLabels,mode)=>{ onUpdate({...certType, labels: mode==='replace'?newLabels:[...(certType.labels||[]),...newLabels]}); setShowImport(false); }}/>}
    </div>
  );
}

/* ============================ CREATE CERTIFICATE TAB ============================ */
function CreateTab({certTypes,branchCode,onGenerated,fbOk,verifyBaseUrl,verifyParam,onBack}){
  const categories=useMemo(()=>[...new Set(certTypes.map(ct=>ct.listName||'Uncategorized'))],[certTypes]);
  const [pickedCategory,setPickedCategory]=useState(categories[0]||'');
  useEffect(()=>{ if(categories.length && !categories.includes(pickedCategory)) setPickedCategory(categories[0]); },[categories]);

  const typesInCat=useMemo(()=>certTypes.filter(ct=>(ct.listName||'Uncategorized')===pickedCategory),[certTypes,pickedCategory]);

  const [pickedId,setPickedId]=useState(typesInCat[0]?.id||null);
  useEffect(()=>{
    if(!typesInCat.find(t=>t.id===pickedId)) setPickedId(typesInCat[0]?.id||null);
  },[typesInCat]);

  const [values,setValues]=useState({});
  const [generated,setGenerated]=useState(null);
  const [overrides,setOverrides]=useState({});
  const [selected,setSelected]=useState(null);
  const [showBulk,setShowBulk]=useState(false);
  const certType=certTypes.find(c=>c.id===pickedId);
  const certRef=useRef();
  const printRef=useRef();
  const [issueDateVal,setIssueDateVal]=useState(new Date().toISOString().slice(0,10));
  const [teacherPhotoVal,setTeacherPhotoVal]=useState('');

  const mergedCertType=useMemo(()=>{
    if(!certType) return null;
    return {
      ...certType,
      labels:(certType.labels||[]).map(l=>({...l,style:{...l.style,...(overrides[l.id]||{})}})),
      qr:{...(certType.qr||DEFAULT_QR),...(overrides.__qr__||{})},
      idText:{...(certType.idText||DEFAULT_IDTEXT),...(overrides.__idtext__||{})},
      photo:{...(certType.photo||DEFAULT_PHOTO),...(overrides.__photo__||{})},
      issueDate:{...(certType.issueDate||DEFAULT_ISSUE),...(overrides.__issue__||{})}
    };
  },[certType,overrides]);

  const updateOverrideLabel=(id,patch)=>setOverrides(p=>({...p,[id]:{...p[id],...patch}}));
  const updateOverrideQr=(patch)=>setOverrides(p=>({...p,__qr__:{...p.__qr__,...patch}}));
  const updateOverrideIdText=(patch)=>setOverrides(p=>({...p,__idtext__:{...p.__idtext__,...patch}}));
  const resetOverrides=()=>{setOverrides({});showToast('Adjustments reset to template defaults','i');};

    useEffect(()=>{ setValues({}); setGenerated(null); setOverrides({}); setSelected(null); setTeacherPhotoVal(''); },[pickedId]);
  useEffect(()=>{ if(certType) setPrintPageOrientation(certType.orientation); },[certType]);

  if(!certTypes.length){
    return(
      <div>
        <div className="page-sub">No certificate types yet. Go to the <strong>Types</strong> tab and create one first.</div>
        <button className="btn btn-ghost" onClick={onBack}>← Back to Types</button>
      </div>
    );
  }

  const setVal=(key,v)=>setValues(p=>({...p,[key]:v}));

  const generate=async()=>{
    if(!certType)return;
    const missing=(certType.labels||[]).filter(l=>!values[l.key]?.trim());
    if(missing.length){ showToast(`Fill: ${missing.map(m=>m.label).join(', ')}`,'w'); return; }

    if(certType.photo?.perCertificate && !teacherPhotoVal){ showToast('Please upload the teacher photo first','w'); return; }
    const certId=genCertId(branchCode);
    const baseCert={
      certId, shortCode:genShortCode(certId), certTypeId:certType.id, certTypeName:certType.name, listName:certType.listName,
      values:{...values}, createdAt:Date.now(), createdDate:new Date().toISOString().slice(0,10),
      issueDate:issueDateVal, issueYear:new Date(issueDateVal).getFullYear(),
      teacherPhoto: teacherPhotoVal||null,
      snapshot:{templateImage:mergedCertType.templateImage, labels:mergedCertType.labels, qr:mergedCertType.qr, idText:mergedCertType.idText, photo:mergedCertType.photo, issueDate:mergedCertType.issueDate, orientation:mergedCertType.orientation}
    };

    setGenerated(baseCert);
    showToast('Rendering certificate…','i');

    let node=null;
    for(let i=0;i<20;i++){
      node = printRef.current?.querySelector('.cert-frame');
      if(node) break;
      await new Promise(r=>setTimeout(r,50));
    }

    let certImageUrl=null;
    if(node){
      try{
        await waitForImagesLoaded(node);
        const canvas=await html2canvas(node,{scale:2,useCORS:true,backgroundColor:'#ffffff'});
        const dataUrl=canvas.toDataURL('image/png');
        const cloudReady=window.CLOUDINARY_CONFIG.cloudName && window.CLOUDINARY_CONFIG.cloudName!=='YOUR_CLOUD_NAME';
        if(cloudReady){
          showToast('Uploading certificate image to Cloudinary…','i');
          try{
            certImageUrl=await window.uploadToCloudinary(dataUrl, window.CLOUDINARY_CONFIG.folder+'/certificates');
            showToast('Certificate image uploaded ✓','s');
          }catch(e){
            showToast('Cloudinary upload failed — verify page will use live render instead: '+e.message,'w');
          }
        }else{
          showToast('Cloudinary not configured — verify page will use live render instead','w');
        }
      }catch(e){
        showToast('Could not capture certificate image: '+e.message,'w');
      }
    }

    const finalCert={...baseCert, certImageUrl: certImageUrl||null};
    setGenerated(finalCert);

    showToast('Saving certificate to database…','i');
    await onGenerated(finalCert);
  };

  const doPrint=()=>{ setPrintPageOrientation(certType.orientation); window.print(); };

  const exportPdf=async()=>{
    if(!generated) return;
    showToast('Generating PDF…','i');
    try{
      const node=certRef.current;
      const canvas=await html2canvas(node,{scale:2,useCORS:true,backgroundColor:'#ffffff'});
      const {jsPDF}=window.jspdf;
      const isLand=(certType.orientation||'landscape')==='landscape';
      const doc=new jsPDF({orientation:isLand?'landscape':'portrait',unit:'mm',format:'a4'});
      const pw=doc.internal.pageSize.getWidth(), ph=doc.internal.pageSize.getHeight();
      doc.addImage(canvas.toDataURL('image/jpeg',.95),'JPEG',0,0,pw,ph);
      doc.save(`${generated.certId.replace(/\//g,'-')}.pdf`);
      showToast('PDF saved ✓','s');
    }catch(e){ showToast('PDF failed: '+e.message,'e'); }
  };

  const downloadImage=async()=>{
  if(!generated) return;
  try{
    const node=printRef.current.querySelector('.cert-frame')||printRef.current;
    const canvas=await html2canvas(node,{scale:2,useCORS:true,backgroundColor:null,width:node.offsetWidth,height:node.offsetHeight});
    canvas.toBlob((blob)=>{
      if(!blob){ showToast('Download failed: empty image','e'); return; }
      const url=URL.createObjectURL(blob);
      const link=document.createElement('a'); link.download=`${generated.certId.replace(/\//g,'-')}.png`; link.href=url; link.click();
      setTimeout(()=>URL.revokeObjectURL(url),4000);
    },'image/png');
  }catch(e){ showToast('Download failed: '+e.message,'e'); }
};

  const shareWhatsapp=async()=>{
    if(!generated) return;
    try{
      const canvas=await html2canvas(printRef.current,{scale:2,useCORS:true,backgroundColor:'#ffffff'});
      canvas.toBlob(async(blob)=>{
        const file=new File([blob],`${generated.certId.replace(/\//g,'-')}.png`,{type:'image/png'});
        if(navigator.canShare && navigator.canShare({files:[file]})){
          try{ await navigator.share({files:[file],title:'Certificate',text:`Certificate ${generated.certId}`}); return; }catch(e){}
        }
        const link=document.createElement('a'); link.download=`${generated.certId.replace(/\//g,'-')}.png`; link.href=canvas.toDataURL('image/png'); link.click();
        const msg=encodeURIComponent(`🏅 Certificate generated!\nID: ${generated.certId}\n(Attach the downloaded image in WhatsApp)`);
        window.open(`https://wa.me/?text=${msg}`,'_blank');
        showToast('Image downloaded — attach it in the WhatsApp chat that opened','i');
      },'image/png');
    }catch(e){ showToast('Share failed: '+e.message,'e'); }
  };

  return(
    <div style={{display:'flex',gap:18,flexWrap:'wrap'}}>
      <div style={{flex:'1 1 380px',minWidth:320}}>
        <div style={{display:'flex',alignItems:'center',gap:9,marginBottom:4}}>
          <button className="modal-back" onClick={onBack} title="Back to Types">←</button>
          <div className="page-title" style={{marginBottom:0}}>Create Certificate</div>
        </div>
        <div className="page-sub">Pick a certificate type, fill in the details, then generate. A unique ID (TWS/{branchCode||'BR'}/{new Date().getFullYear()}/####) and QR code will be added automatically.</div>
        <span className="f-lbl">1. Choose Category</span>
        <select className="f-select" value={pickedCategory} onChange={e=>setPickedCategory(e.target.value)}>
          {categories.map(cat=><option key={cat} value={cat}>{cat} ({certTypes.filter(c=>(c.listName||'Uncategorized')===cat).length})</option>)}
        </select>
        <span className="f-lbl">Issue Date</span>
        <input className="f-input" type="date" value={issueDateVal} onChange={e=>setIssueDateVal(e.target.value)}/>

        <span className="f-lbl">2. Choose Template</span>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(120px,1fr))',gap:8,marginBottom:14}}>
          {typesInCat.map((ct,i)=>(
            <div key={ct.id} onClick={()=>setPickedId(ct.id)}
              style={{border:'2px solid',borderColor:pickedId===ct.id?'var(--gold)':'var(--bdr)',borderRadius:9,overflow:'hidden',cursor:'pointer',background:'#fff',boxShadow:pickedId===ct.id?'0 4px 16px rgba(143,106,46,.3)':'0 1px 4px rgba(0,0,0,.06)',transition:'all .15s',position:'relative'}}>
              {pickedId===ct.id && <div style={{position:'absolute',top:4,right:4,background:'var(--gold)',color:'#fff',borderRadius:'50%',width:18,height:18,display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:800,zIndex:2}}>✓</div>}
              <img src={ct.templateImage} alt={ct.name} style={{width:'100%',height:74,objectFit:'cover',display:'block',background:'#ece3d0'}}/>
              <div style={{padding:'5px 7px'}}>
                <div style={{fontSize:10,fontWeight:800,color:'var(--navy)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>Template {i+1}</div>
                <div style={{fontSize:8.5,color:'var(--tx3)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{ct.name}</div>
              </div>
            </div>
          ))}
          {!typesInCat.length && <div style={{fontSize:10.5,color:'var(--tx3)',padding:'10px 0'}}>No templates in this category.</div>}
        </div>
        {certType?.photo?.perCertificate && (
          <div style={{maxWidth:300,marginBottom:14}}>
            <span className="f-lbl">Teacher Photo</span>
            <label className="btn btn-ghost btn-sm" style={{cursor:'pointer',display:'inline-block',margin:0}}>
              {teacherPhotoVal?'🔁 Replace Photo':'⬆ Upload Photo'}
              <input type="file" accept="image/*" style={{display:'none'}}
                onChange={async(e)=>{
                  const f=e.target.files[0]; e.target.value='';
                  if(!f||!f.type.match(/image\//)){ showToast('Please choose an image file (jpg/png/etc.)','e'); return; }
                  const reader=new FileReader();
                  reader.onload=async(ev)=>{
                    let img=ev.target.result;
                    const cloudReady=window.CLOUDINARY_CONFIG.cloudName&&window.CLOUDINARY_CONFIG.cloudName!=='YOUR_CLOUD_NAME';
                    if(cloudReady){
                      try{ img=await window.uploadToCloudinary(img, window.CLOUDINARY_CONFIG.folder+'/photos'); }
                      catch(err){ showToast('Cloud upload failed, using local image: '+err.message,'w'); }
                    }
                    setTeacherPhotoVal(img);
                  };
                  reader.readAsDataURL(f);
                }}/>
            </label>
            {teacherPhotoVal && <img src={teacherPhotoVal} alt="" style={{display:'block',marginTop:6,maxHeight:80,borderRadius:6}}/>}
          </div>
        )}
        {certType && (
          <div className="form-grid" style={{marginTop:10}}>
            {(certType.labels||[]).map(l=>{
  if(l.type==='image'){
    return (
      <div className="form-field" key={l.id}>
        <label>🖼 {l.label}</label>
        <label className="btn btn-ghost btn-sm" style={{cursor:'pointer',display:'inline-block',margin:0}}>
          {values[l.key]?'🔁 Replace Photo':'⬆ Upload Photo'}
          <input type="file" accept="image/*" style={{display:'none'}}
            onChange={async(e)=>{
              const f=e.target.files[0]; e.target.value='';
              if(!f||!f.type.match(/image\//)){ showToast('Please choose an image file (jpg/png/etc.)','e'); return; }
              const reader=new FileReader();
              reader.onload=async(ev)=>{
                let img=ev.target.result;
                const cloudReady=window.CLOUDINARY_CONFIG.cloudName&&window.CLOUDINARY_CONFIG.cloudName!=='YOUR_CLOUD_NAME';
                if(cloudReady){
                  try{ img=await window.uploadToCloudinary(img, window.CLOUDINARY_CONFIG.folder+'/photos'); }
                  catch(err){ showToast('Cloud upload failed, using local image: '+err.message,'w'); }
                }
                setVal(l.key,img);
              };
              reader.readAsDataURL(f);
            }}/>
        </label>
        {values[l.key] && <img src={values[l.key]} alt="" style={{display:'block',marginTop:6,maxHeight:70,borderRadius:6}}/>}
      </div>
    );
  }
  return (
    <div className="form-field" key={l.id}>
      <label>{l.type==='date'?'📅 ':''}{l.label}</label>
      <input type={l.type==='date'?'date':'text'} value={values[l.key]||''} onChange={e=>setVal(l.key,e.target.value)} placeholder={l.type==='date'?'':`Enter ${l.label}`}/>
    </div>
  );
})}
          </div>
        )}
        <div style={{display:'flex',gap:8,marginTop:6,flexWrap:'wrap'}}>
          <button className="btn btn-gold" onClick={generate}>🏅 Generate Certificate</button>
          <button className="btn btn-navy" onClick={()=>setShowBulk(true)} disabled={!certType}>📊 Bulk Generate (Excel)</button>
          {generated && <>
            <button className="btn btn-navy" onClick={doPrint}>🖨 Print (A4)</button>
            <button className="btn btn-navy" onClick={exportPdf}>📄 Save as PDF</button>
            <button className="btn btn-ghost" onClick={downloadImage}>🖼 Download PNG</button>
            <button className="btn btn-wa" onClick={shareWhatsapp}>💬 Share on WhatsApp</button>
          </>}
        </div>
        {generated && <div style={{marginTop:10,fontSize:10.5,color:'var(--tx2)'}}>Unique ID: <span className="hist-id">{generated.certId}</span></div>}
      </div>

      <div style={{flex:'1 1 420px',minWidth:320}}>
        <div className="page-sub" style={{marginBottom:6}}>Click any text, the photo box, or the QR block to nudge it for <strong>this certificate only</strong> — the saved template stays untouched.</div>
        <div className="cert-outer" onClick={()=>setSelected(null)}>
          <div ref={certRef}>
            <CertificateView certType={mergedCertType} values={values} certId={generated?.certId||''} scale={0.55} selectedLabelId={selected} onSelectLabel={setSelected} verifyBaseUrl={verifyBaseUrl} verifyParam={verifyParam} interactive={true} issueDate={issueDateVal} teacherPhoto={teacherPhotoVal}/>
          </div>
        </div>
        {Object.keys(overrides).length>0 && <button className="btn btn-ghost btn-sm" style={{marginTop:8}} onClick={resetOverrides}>↺ Reset Adjustments</button>}
      </div>

      <div className="side" style={{position:'static',boxShadow:'none',border:'1px solid var(--bdr)',borderRadius:10,flex:'0 0 280px'}}>
        <div className="side-hdr">⚙ Adjust This Certificate</div>
        <div className="side-body">
          {!selected && <div style={{fontSize:11,color:'var(--tx3)',padding:'20px 6px',textAlign:'center'}}>Select a label, ID text, photo box, or QR block above to adjust it for this certificate only.</div>}

          {selected && certType && (certType.labels||[]).find(l=>l.id===selected) && (()=>{
            const baseLbl=(certType.labels||[]).find(l=>l.id===selected);
            const curStyle={...baseLbl.style,...(overrides[selected]||{})};
            return(
              <div className="dz-sec">
                <div className="dz-sec-hdr">✏️ {baseLbl.label}</div>
                <div className="dz-sec-body">
                  <XY x={curStyle.x||0} y={curStyle.y||0} onX={v=>updateOverrideLabel(selected,{x:v})} onY={v=>updateOverrideLabel(selected,{y:v})} onReset={()=>updateOverrideLabel(selected,{x:baseLbl.style.x||0,y:baseLbl.style.y||0})}/>
                  <SliderRow label="Size" val={curStyle.fontSize||16} min={8} max={72} onChange={v=>updateOverrideLabel(selected,{fontSize:v})} unit="px"/>
                  <div className="sld-row"><span className="sld-lbl">Color</span><input type="color" value={curStyle.color||'#1c2430'} onChange={e=>updateOverrideLabel(selected,{color:e.target.value})}/></div>
                </div>
              </div>
            );
          })()}

          {selected==='__idtext__' && certType && (()=>{
            const cur={...(certType.idText||DEFAULT_IDTEXT),...(overrides.__idtext__||{})};
            return(
              <div className="dz-sec">
                <div className="dz-sec-hdr">🪪 Certificate ID Text</div>
                <div className="dz-sec-body">
                  <XY x={cur.x||0} y={cur.y||0} onX={v=>updateOverrideIdText({x:v})} onY={v=>updateOverrideIdText({y:v})}/>
                  <SliderRow label="Size" val={cur.fontSize||9} min={6} max={22} onChange={v=>updateOverrideIdText({fontSize:v})} unit="px"/>
                </div>
              </div>
            );
          })()}
          
          {selected==='__issue__' && certType && (()=>{
            const cur={...(certType.issueDate||DEFAULT_ISSUE),...(overrides.__issue__||{})};
            return(
              <div className="dz-sec">
                <div className="dz-sec-hdr">📅 Issue Date</div>
                <div className="dz-sec-body">
                  <XY x={cur.x||0} y={cur.y||0} onX={v=>setOverrides(p=>({...p,__issue__:{...p.__issue__,x:v}}))} onY={v=>setOverrides(p=>({...p,__issue__:{...p.__issue__,y:v}}))}/>
                  <SliderRow label="Size" val={cur.fontSize||9} min={6} max={22} onChange={v=>setOverrides(p=>({...p,__issue__:{...p.__issue__,fontSize:v}}))} unit="px"/>
                </div>
              </div>
            );
          })()}

          {selected==='__qr__' && certType && (()=>{
            const cur={...(certType.qr||DEFAULT_QR),...(overrides.__qr__||{})};
            return(
              <div className="dz-sec">
                <div className="dz-sec-hdr">▦ QR Code</div>
                <div className="dz-sec-body">
                  <SliderRow label="Size" val={cur.size||70} min={30} max={180} onChange={v=>updateOverrideQr({size:v})} unit="px"/>
                  <XY x={cur.x||0} y={cur.y||0} onX={v=>updateOverrideQr({x:v})} onY={v=>updateOverrideQr({y:v})} onReset={()=>updateOverrideQr({x:0,y:0})}/>
                </div>
              </div>
            );
          })()}
        </div>
      </div>

      {generated && (
        <div id="print-target" ref={printRef}>
          <CertificateView certType={mergedCertType} values={values} certId={generated.certId} scale={1} verifyBaseUrl={verifyBaseUrl} verifyParam={verifyParam} issueDate={issueDateVal} teacherPhoto={teacherPhotoVal}/>
        </div>
      )}
      {showBulk && <BulkGenerateModal certType={certType} branchCode={branchCode} verifyBaseUrl={verifyBaseUrl} verifyParam={verifyParam} onGenerated={onGenerated} onClose={()=>setShowBulk(false)}/>}
    </div>
  );
}

/* ============================ HISTORY TAB ============================ */
function HistoryTab({certificates,certTypes,fbOk,onRefresh,onView,onEdit,onDelete,verifyBaseUrl,verifyParam}){
  const [search,setSearch]=useState('');
  const [flist,setFlist]=useState('');
  const [fdateFrom,setFdateFrom]=useState('');
  const [fdateTo,setFdateTo]=useState('');
  const [collapsed,setCollapsed]=useState({});
  const [selectedIds,setSelectedIds]=useState(new Set());
  const [bulkBusy,setBulkBusy]=useState(false);
  const [bulkPreview,setBulkPreview]=useState(null);
  const [singleBusyId,setSingleBusyId]=useState(null);
  const hiddenRef=useRef();

  const filtered=useMemo(()=>{
    let r=[...certificates];
    const q=search.toLowerCase();
    if(q) r=r.filter(c=>c.certId.toLowerCase().includes(q)||Object.values(c.values||{}).some(v=>String(v).toLowerCase().includes(q)));
    if(flist) r=r.filter(c=>c.listName===flist);
    if(fdateFrom) r=r.filter(c=>c.createdDate>=fdateFrom);
    if(fdateTo) r=r.filter(c=>c.createdDate<=fdateTo);
    r.sort((a,b)=>b.createdAt-a.createdAt);
    return r;
  },[certificates,search,flist,fdateFrom,fdateTo]);
  const lists=[...new Set(certificates.map(c=>c.listName).filter(Boolean))];

  const grouped=useMemo(()=>{
    const g={};
    filtered.forEach(c=>{
      const key=c.listName||'Uncategorized';
      if(!g[key]) g[key]=[];
      g[key].push(c);
    });
    return Object.entries(g).sort((a,b)=>b[1].length-a[1].length);
  },[filtered]);

  const toggleCat=(key)=>setCollapsed(p=>({...p,[key]:!p[key]}));

  const fieldPairs=(c)=>{
    const ct=c.snapshot||certTypes.find(t=>t.id===c.certTypeId);
    const labels=ct?.labels||[];
    if(!labels.length) return Object.entries(c.values||{}).slice(0,3);
    return labels.slice(0,3).map(l=>[l.label, l.type==='date'?fmtDate(c.values?.[l.key]):(c.values?.[l.key]||'—')]);
  };

  const toggleSelect=(certId)=>setSelectedIds(prev=>{
    const n=new Set(prev);
    if(n.has(certId)) n.delete(certId); else n.add(certId);
    return n;
  });
  const selectAllInList=(certsInList,checked)=>setSelectedIds(prev=>{
    const n=new Set(prev);
    certsInList.forEach(c=>{ if(checked) n.add(c.certId); else n.delete(c.certId); });
    return n;
  });
  const clearSelection=()=>setSelectedIds(new Set());

  const captureCertCanvas=async(cert)=>{
    const ct=cert.snapshot||certTypes.find(t=>t.id===cert.certTypeId);
    if(!ct) return null;
    setBulkPreview({cert,ct});
    await new Promise(r=>setTimeout(r,60));
    let node=null;
    for(let i=0;i<20;i++){ node=hiddenRef.current?.querySelector('.cert-frame'); if(node) break; await new Promise(r=>setTimeout(r,50)); }
    if(!node) return null;
    try{
      await waitForImagesLoaded(node);
      const canvas=await html2canvas(node,{scale:2,useCORS:true,backgroundColor:'#ffffff'});
      return {canvas,ct};
    }catch(e){ return null; }
  };

  const safeFileName=(certId)=>certId.replace(/\//g,'-');

  const downloadSingleImage=async(cert)=>{
    setSingleBusyId(cert.certId);
    showToast(`Rendering ${cert.certId}…`,'i');
    const result=await captureCertCanvas(cert);
    setBulkPreview(null); setSingleBusyId(null);
    if(!result){ showToast('Could not render this certificate','e'); return; }
    result.canvas.toBlob((blob)=>{
      if(!blob){ showToast('Download failed: empty image','e'); return; }
      const url=URL.createObjectURL(blob);
      const link=document.createElement('a'); link.download=`${safeFileName(cert.certId)}.png`; link.href=url; link.click();
      setTimeout(()=>URL.revokeObjectURL(url),4000);
      showToast('Image downloaded ✓','s');
    },'image/png');
  };

  const downloadSinglePdf=async(cert)=>{
    if(!window.jspdf){ showToast('PDF engine still loading — try again','w'); return; }
    setSingleBusyId(cert.certId);
    showToast(`Rendering ${cert.certId}…`,'i');
    const result=await captureCertCanvas(cert);
    setBulkPreview(null); setSingleBusyId(null);
    if(!result){ showToast('Could not render this certificate','e'); return; }
    try{
      const {jsPDF}=window.jspdf;
      const isLand=(result.ct.orientation||'landscape')==='landscape';
      const doc=new jsPDF({orientation:isLand?'landscape':'portrait',unit:'mm',format:'a4'});
      const pw=doc.internal.pageSize.getWidth(), ph=doc.internal.pageSize.getHeight();
      doc.addImage(result.canvas.toDataURL('image/jpeg',.95),'JPEG',0,0,pw,ph);
      doc.save(`${safeFileName(cert.certId)}.pdf`);
      showToast('PDF saved ✓','s');
    }catch(e){ showToast('PDF failed: '+e.message,'e'); }
  };

  const downloadSelectedImages=async()=>{
    if(!selectedIds.size){ showToast('Select at least one certificate first','w'); return; }
    if(!window.JSZip){ showToast('Zip engine still loading — try again in a moment','w'); return; }
    setBulkBusy(true);
    showToast(`Preparing ${selectedIds.size} image(s)…`,'i');
    const zip=new JSZip();
    const selectedCerts=certificates.filter(c=>selectedIds.has(c.certId));
    let done=0;
    for(const cert of selectedCerts){
      const result=await captureCertCanvas(cert);
      if(result){
        const dataUrl=result.canvas.toDataURL('image/png');
        zip.file(`${safeFileName(cert.certId)}.png`, dataUrl.split(',')[1], {base64:true});
        done++;
      }
    }
    setBulkPreview(null);
    if(!done){ setBulkBusy(false); showToast('Could not render any selected certificates','e'); return; }
    try{
      const blob=await zip.generateAsync({type:'blob'});
      const url=URL.createObjectURL(blob);
      const link=document.createElement('a'); link.download=`certificates_${Date.now()}.zip`; link.href=url; link.click();
      setTimeout(()=>URL.revokeObjectURL(url),4000);
      showToast(`Downloaded ${done} image(s) as ZIP ✓`,'s');
    }catch(e){ showToast('Zip failed: '+e.message,'e'); }
    setBulkBusy(false);
  };

  const downloadSelectedPdf=async()=>{
    if(!selectedIds.size){ showToast('Select at least one certificate first','w'); return; }
    if(!window.jspdf){ showToast('PDF engine still loading — try again in a moment','w'); return; }
    setBulkBusy(true);
    showToast(`Preparing PDF for ${selectedIds.size} certificate(s)…`,'i');
    const {jsPDF}=window.jspdf;
    let doc=null;
    const selectedCerts=certificates.filter(c=>selectedIds.has(c.certId));
    let done=0;
    for(const cert of selectedCerts){
      const result=await captureCertCanvas(cert);
      if(!result) continue;
      const isLand=(result.ct.orientation||'landscape')==='landscape';
      if(!doc) doc=new jsPDF({orientation:isLand?'landscape':'portrait',unit:'mm',format:'a4'});
      else doc.addPage('a4', isLand?'landscape':'portrait');
      const pw=doc.internal.pageSize.getWidth(), ph=doc.internal.pageSize.getHeight();
      doc.addImage(result.canvas.toDataURL('image/jpeg',.95),'JPEG',0,0,pw,ph);
      done++;
    }
    setBulkPreview(null);
    if(!doc||!done){ setBulkBusy(false); showToast('Could not render any selected certificates','e'); return; }
    doc.save(`certificates_${Date.now()}.pdf`);
    showToast(`Downloaded PDF with ${done} certificate(s) ✓`,'s');
    setBulkBusy(false);
  };

  return(
    <div>
      <div className="page-title">Certificate History</div>
      <div className="page-sub">Certificates grouped by type. Search, filter by date range, view, edit, or bulk-download as images/PDF.</div>
      <div className="filter-bar">
        <input placeholder="🔍 Search name, ID…" value={search} onChange={e=>setSearch(e.target.value)}/>
        <select value={flist} onChange={e=>setFlist(e.target.value)}><option value="">All Categories</option>{lists.map(l=><option key={l} value={l}>{l}</option>)}</select>
        <input type="date" value={fdateFrom} onChange={e=>setFdateFrom(e.target.value)} title="From date"/>
        <input type="date" value={fdateTo} onChange={e=>setFdateTo(e.target.value)} title="To date"/>
        {(search||flist||fdateFrom||fdateTo)&&<button className="btn btn-ghost btn-sm" onClick={()=>{setSearch('');setFlist('');setFdateFrom('');setFdateTo('');}}>✕ Clear</button>}
        <button className="btn btn-navy btn-sm" onClick={onRefresh} disabled={!fbOk} style={{marginLeft:'auto'}}>📥 Reload from Firebase</button>
      </div>

      {selectedIds.size>0 && (
        <div style={{display:'flex',alignItems:'center',gap:8,background:'#fbf1d8',border:'1.5px solid var(--gold)',borderRadius:8,padding:'8px 12px',marginBottom:14,flexWrap:'wrap'}}>
          <span style={{fontSize:11,fontWeight:800,color:'var(--navy)'}}>{selectedIds.size} selected</span>
          <button className="btn btn-navy btn-sm" onClick={downloadSelectedImages} disabled={bulkBusy}>{bulkBusy?'Working…':'🖼 Download Images (ZIP)'}</button>
          <button className="btn btn-navy btn-sm" onClick={downloadSelectedPdf} disabled={bulkBusy}>{bulkBusy?'Working…':'📄 Download PDF (Combined)'}</button>
          <button className="btn btn-ghost btn-sm" onClick={clearSelection} disabled={bulkBusy}>✕ Clear Selection</button>
        </div>
      )}

      {!filtered.length ? (
        <div style={{textAlign:'center',padding:'40px 0',color:'var(--tx2)'}}>
          <div style={{fontSize:40,marginBottom:8}}>📜</div>
          <div style={{fontFamily:'Cinzel,serif',fontSize:16,fontWeight:700,color:'var(--navy)'}}>No certificates found</div>
        </div>
      ) : (
        grouped.map(([catName,certs])=>{
          const isCollapsed=!!collapsed[catName];
          const allSelected=certs.every(c=>selectedIds.has(c.certId));
          return(
            <div className="cat-section" key={catName}>
              <div className="cat-hdr">
                <span style={{fontSize:14,color:'var(--tx2)',cursor:'pointer'}} onClick={()=>toggleCat(catName)}>{isCollapsed?'▸':'▾'}</span>
                <h3 style={{flex:1,cursor:'pointer'}} onClick={()=>toggleCat(catName)}>🏅 {catName}</h3>
                <label style={{display:'flex',alignItems:'center',gap:5,fontSize:9.5,fontWeight:700,color:'var(--tx2)',cursor:'pointer'}}>
                  <input type="checkbox" checked={allSelected} onChange={e=>selectAllInList(certs,e.target.checked)}/> Select All
                </label>
                <span className="cat-count">{certs.length} certificate{certs.length!==1?'s':''}</span>
              </div>
              {!isCollapsed && (
                <div className="hist-grid">
                  {certs.map(c=>{
                    const ct=c.snapshot||certTypes.find(t=>t.id===c.certTypeId);
                    const pairs=fieldPairs(c);
                    const busy=singleBusyId===c.certId;
                    return(
                      <div className="hist-card" key={c.certId} style={{position:'relative'}}>
                        <label style={{position:'absolute',top:10,right:10,cursor:'pointer'}}>
                          <input type="checkbox" checked={selectedIds.has(c.certId)} onChange={()=>toggleSelect(c.certId)}/>
                        </label>
                        <div className="hist-name">{ct?.name||c.certTypeName||'Certificate'}</div>
                        <div className="hist-meta">
                          {pairs.map(([lbl,val])=>(<div key={lbl}><strong style={{color:'var(--navy)'}}>{lbl}:</strong> {val||'—'}</div>))}
                          <div style={{marginTop:4,color:'var(--tx3)'}}>{new Date(c.createdAt).toLocaleString()}</div>
                        </div>
                        <div className="hist-id">{c.certId}</div>
                        <div style={{display:'flex',gap:5,marginTop:9,flexWrap:'wrap'}}>
                          <button className="btn btn-navy btn-xs" onClick={()=>onView(c)}>👁 View / Print</button>
                          <button className="btn btn-grn btn-xs" onClick={()=>onEdit(c)}>✏️ Edit</button>
                          <button className="btn btn-ghost btn-xs" onClick={()=>downloadSingleImage(c)} disabled={busy}>{busy?'…':'🖼 PNG'}</button>
                          <button className="btn btn-ghost btn-xs" onClick={()=>downloadSinglePdf(c)} disabled={busy}>{busy?'…':'📄 PDF'}</button>
                          <button className="btn btn-red btn-xs" onClick={()=>onDelete(c.certId)}>🗑</button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })
      )}
      {bulkPreview && (
        <div style={{position:'absolute',left:-99999,top:0,pointerEvents:'none'}} ref={hiddenRef}>
          <CertificateView certType={bulkPreview.ct} values={bulkPreview.cert.values} certId={bulkPreview.cert.certId} scale={1} verifyBaseUrl={verifyBaseUrl} verifyParam={verifyParam}/>
        </div>
      )}
    </div>
  );
}

/* ============================ VIEW / REPRINT MODAL ============================ */
function ViewCertModal({cert,certTypes,onClose,verifyBaseUrl,verifyParam}){
 const ct=cert.snapshot||certTypes.find(t=>t.id===cert.certTypeId);
  const ref=useRef();
  const printRef=useRef();
  useEffect(()=>{ if(ct) setPrintPageOrientation(ct.orientation); },[ct]);
  const doPrint=()=>{ if(ct) setPrintPageOrientation(ct.orientation); window.print(); };
  const exportPdf=async()=>{
    try{
      const canvas=await html2canvas(printRef.current,{scale:2,useCORS:true,backgroundColor:'#fff'});
      const {jsPDF}=window.jspdf;
      const isLand=(ct?.orientation||'landscape')==='landscape';
      const doc=new jsPDF({orientation:isLand?'landscape':'portrait',unit:'mm',format:'a4'});
      const pw=doc.internal.pageSize.getWidth(), ph=doc.internal.pageSize.getHeight();
      doc.addImage(canvas.toDataURL('image/jpeg',.95),'JPEG',0,0,pw,ph);
      doc.save(`${cert.certId.replace(/\//g,'-')}.pdf`);
    }catch(e){ showToast('PDF failed: '+e.message,'e'); }
  };
  const downloadImage=async()=>{
  try{
    const node=printRef.current.querySelector('.cert-frame')||printRef.current;
    const canvas=await html2canvas(node,{scale:2,useCORS:true,backgroundColor:null,width:node.offsetWidth,height:node.offsetHeight});
    canvas.toBlob((blob)=>{
      if(!blob){ showToast('Download failed: empty image','e'); return; }
      const url=URL.createObjectURL(blob);
      const link=document.createElement('a'); link.download=`${cert.certId.replace(/\//g,'-')}.png`; link.href=url; link.click();
      setTimeout(()=>URL.revokeObjectURL(url),4000);
    },'image/png');
  }catch(e){ showToast('Download failed: '+e.message,'e'); }
};
  const shareWhatsapp=async()=>{
    try{
      const canvas=await html2canvas(printRef.current,{scale:2,useCORS:true,backgroundColor:'#fff'});
      canvas.toBlob(async(blob)=>{
        const file=new File([blob],`${cert.certId.replace(/\//g,'-')}.png`,{type:'image/png'});
        if(navigator.canShare&&navigator.canShare({files:[file]})){ try{await navigator.share({files:[file],title:'Certificate'});return;}catch(e){} }
        const link=document.createElement('a'); link.download=`${cert.certId.replace(/\//g,'-')}.png`; link.href=canvas.toDataURL('image/png'); link.click();
        window.open(`https://wa.me/?text=${encodeURIComponent('Certificate '+cert.certId)}`,'_blank');
      },'image/png');
    }catch(e){ showToast('Share failed','e'); }
  };
  if(!ct) return (<div className="modal-bg" onClick={onClose}><div className="modal" onClick={e=>e.stopPropagation()}><h3>⚠ Template Missing</h3><p style={{fontSize:11,color:'var(--tx2)'}}>The certificate type for this record was deleted.</p><button className="btn btn-ghost" onClick={onClose}>Close</button></div></div>);
  return(
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" style={{maxWidth:760}} onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
          <h3 style={{marginBottom:0}}>👁 {cert.certId}</h3>
          <button className="btn btn-ghost btn-sm" onClick={onClose}>✕ Close</button>
        </div>
        <div className="cert-outer" ref={ref}>
          <CertificateView certType={ct} values={cert.values} certId={cert.certId} scale={0.5} verifyBaseUrl={verifyBaseUrl} verifyParam={verifyParam} issueDate={cert.issueDate} teacherPhoto={cert.teacherPhoto}/>
        </div>
        <div style={{display:'flex',gap:8,marginTop:12,flexWrap:'wrap'}}>
          <button className="btn btn-navy" onClick={doPrint}>🖨 Print</button>
          <button className="btn btn-navy" onClick={exportPdf}>📄 Save as PDF</button>
          <button className="btn btn-ghost" onClick={downloadImage}>🖼 Download PNG</button>
          <button className="btn btn-wa" onClick={shareWhatsapp}>💬 WhatsApp</button>
        </div>
        <div id="print-target" ref={printRef}>
          <CertificateView certType={ct} values={cert.values} certId={cert.certId} scale={1} verifyBaseUrl={verifyBaseUrl} verifyParam={verifyParam} issueDate={cert.issueDate}/>
        </div>
      </div>
    </div>
  );
}

/* ============================ EDIT CERTIFICATE MODAL ============================ */
function EditCertModal({cert,certTypes,onClose,onSaved,fbOk,activeBranch,activeSession,verifyBaseUrl,verifyParam}){
  const ct=cert.snapshot||certTypes.find(t=>t.id===cert.certTypeId);
  const [values,setValues]=useState({...cert.values});
  const [saving,setSaving]=useState(false);
  const printRef=useRef();
  if(!ct) return (<div className="modal-bg" onClick={onClose}><div className="modal" onClick={e=>e.stopPropagation()}><h3>⚠ Template Missing</h3><p style={{fontSize:11,color:'var(--tx2)'}}>Cannot edit — original template data is missing.</p><button className="btn btn-ghost" onClick={onClose}>Close</button></div></div>);

  const setVal=(key,v)=>setValues(p=>({...p,[key]:v}));

  const save=async()=>{
    const missing=(ct.labels||[]).filter(l=>!values[l.key]?.trim());
    if(missing.length){ showToast(`Fill: ${missing.map(m=>m.label).join(', ')}`,'w'); return; }
    setSaving(true);
    showToast('Re-rendering certificate…','i');

    let node=null;
    for(let i=0;i<20;i++){
      node = printRef.current?.querySelector('.cert-frame');
      if(node) break;
      await new Promise(r=>setTimeout(r,50));
    }

    let newImageUrl=cert.certImageUrl||null;
    const cloudReady=window.CLOUDINARY_CONFIG.cloudName && window.CLOUDINARY_CONFIG.cloudName!=='YOUR_CLOUD_NAME';
    if(node){
      try{
        await waitForImagesLoaded(node);
        const canvas=await html2canvas(node,{scale:2,useCORS:true,backgroundColor:'#ffffff'});
        const dataUrl=canvas.toDataURL('image/png');
        if(cloudReady){
          showToast('Uploading updated certificate image…','i');
          newImageUrl=await window.uploadToCloudinary(dataUrl, window.CLOUDINARY_CONFIG.folder+'/certificates');
          showToast('New certificate image uploaded ✓','s');
        }
      }catch(e){
        showToast('Could not re-render image: '+e.message,'w');
      }
    }

    const updatedCert={...cert, values:{...values}, certImageUrl:newImageUrl, updatedAt:Date.now()};

    if(fbOk&&window.fbSaveCertificate){
      try{
        await window.fbSaveCertificate(updatedCert,activeBranch,activeSession);
        showToast('Certificate updated ✓','s');
      }catch(e){
        showToast('Update failed to save: '+e.message,'e');
      }
    }else{
      showToast('Firebase not connected — change kept locally only','w');
    }

    setSaving(false);
    onSaved(updatedCert);
  };

  return(
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" style={{maxWidth:760}} onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
          <h3 style={{marginBottom:0}}>✏️ Edit {cert.certId}</h3>
          <button className="btn btn-ghost btn-sm" onClick={onClose}>✕ Close</button>
        </div>
        <div className="form-grid">
          {(ct.labels||[]).map(l=>{
            if(l.type==='image'){
              return (
                <div className="form-field" key={l.id}>
                  <label>🖼 {l.label}</label>
                  <label className="btn btn-ghost btn-sm" style={{cursor:'pointer',display:'inline-block',margin:0}}>
                    {values[l.key]?'🔁 Replace Photo':'⬆ Upload Photo'}
                    <input type="file" accept="image/*" style={{display:'none'}}
                      onChange={async(e)=>{
                        const f=e.target.files[0]; e.target.value='';
                        if(!f||!f.type.match(/image\//)){ showToast('Please choose an image file','e'); return; }
                        const reader=new FileReader();
                        reader.onload=async(ev)=>{
                          let img=ev.target.result;
                          const cloudReady=window.CLOUDINARY_CONFIG.cloudName&&window.CLOUDINARY_CONFIG.cloudName!=='YOUR_CLOUD_NAME';
                          if(cloudReady){
                            try{ img=await window.uploadToCloudinary(img, window.CLOUDINARY_CONFIG.folder+'/photos'); }
                            catch(err){ showToast('Cloud upload failed, using local image: '+err.message,'w'); }
                          }
                          setVal(l.key,img);
                        };
                        reader.readAsDataURL(f);
                      }}/>
                  </label>
                  {values[l.key] && <img src={values[l.key]} alt="" style={{display:'block',marginTop:6,maxHeight:70,borderRadius:6}}/>}
                </div>
              );
            }
            return (
              <div className="form-field" key={l.id}>
                <label>{l.type==='date'?'📅 ':''}{l.label}</label>
                <input type={l.type==='date'?'date':'text'} value={values[l.key]||''} onChange={e=>setVal(l.key,e.target.value)}/>
              </div>
            );
          })}
        </div>
        <div className="cert-outer" style={{marginTop:10}}>
          <CertificateView certType={ct} values={values} certId={cert.certId} scale={0.45} verifyBaseUrl={verifyBaseUrl} verifyParam={verifyParam} issueDate={cert.issueDate}/>
        </div>
        <div style={{display:'flex',gap:8,marginTop:12}}>
          <button className="btn btn-gold" onClick={save} disabled={saving}>{saving?'Saving…':'💾 Save Changes'}</button>
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
        </div>
        <div id="print-target" ref={printRef}>
          <CertificateView certType={ct} values={values} certId={cert.certId} scale={1} verifyBaseUrl={verifyBaseUrl} verifyParam={verifyParam} issueDate={cert.issueDate}/>
        </div>
      </div>
    </div>
  );
}

/* ============================ VERIFY PAGE(QR scan target — in-app fallback) ============================
   This runs only when CERT_WORKER_CONFIG.url is blank. Once your worker.js
   is deployed, QR codes will point to it instead and this overlay won't be used. */
function VerifyOverlay({certId,certTypes,branchName,onClose,fbOk,activeBranch,activeSession}){
  const [cert,setCert]=useState(undefined); // undefined=loading, null=not found
  useEffect(()=>{
    (async()=>{
      if(!fbOk){ setCert(null); return; }
            try{
        let c=null;
        if(activeBranch&&activeSession&&window.fbGetCertificateByShortCode) c=await window.fbGetCertificateByShortCode(certId,activeBranch,activeSession);
        if(!c&&window.fbGetCertificateByShortCodeGlobal) c=await window.fbGetCertificateByShortCodeGlobal(certId);
        setCert(c||null);
      }catch(e){ setCert(null); }
    })();
  },[certId,fbOk]);
  const ct = cert ? (cert.snapshot||certTypes.find(t=>t.id===cert.certTypeId)) : null;
  const now=new Date();
  const primaryName = cert ? (Object.entries(cert.values||{}).find(([k])=>k.toUpperCase().includes('NAME'))?.[1] || Object.values(cert.values||{})[0] || '') : '';
  if(cert===undefined) return(<div className="verify-overlay"><button className="verify-close" onClick={onClose}>✕</button><div className="verify-card" style={{padding:40,textAlign:'center'}}><div style={{fontSize:30}}>⏳</div><div style={{fontWeight:700,marginTop:8}}>Verifying…</div></div></div>);
  if(!cert) return(
    <div className="verify-overlay">
      <button className="verify-close" onClick={onClose}>✕</button>
      <div className="verify-card">
        <div className="verify-hdr"><div style={{display:'inline-flex',alignItems:'center',gap:7,background:'linear-gradient(135deg,#7f1d1d,#c23b3b)',color:'#fff',padding:'7px 18px',borderRadius:50,fontSize:12,fontWeight:800}}>✗ NOT FOUND</div></div>
        <div style={{padding:26,textAlign:'center'}}><div style={{fontSize:42}}>❌</div><div style={{fontFamily:'Cinzel,serif',fontSize:17,fontWeight:800,color:'var(--red)',marginTop:8}}>No certificate found for ID</div><div className="hist-id" style={{marginTop:6}}>{certId}</div></div>
      </div>
    </div>
  );
  return(
    <div className="verify-overlay">
      <button className="verify-close" onClick={onClose}>✕</button>
      <div className="verify-card">
        <div className="verify-hdr">
          <div className="verify-badge">✓ VERIFIED CERTIFICATE</div>
          <div style={{color:'#fff',fontFamily:'Cinzel,serif',fontWeight:700,fontSize:14}}>{cert.listName}</div>
          <div style={{color:'rgba(255,255,255,.65)',fontSize:10.5,marginTop:4}}>Issued &amp; verified by <strong style={{color:'#fff'}}>{branchName||'Teachers Welfare Society'}</strong></div>
        </div>
        <div style={{padding:18}}>
          {ct && <div className="cert-outer" style={{marginBottom:12}}><CertificateView certType={ct} values={cert.values} certId={cert.certId} scale={0.55} verifyBaseUrl={''}/></div>}
          <div className="verify-name-banner">
            <div className="vnb-name">{primaryName || 'Certificate Holder'}</div>
            <div className="vnb-sub">✅ has a VALID certificate</div>
          </div>
          <div className="verify-grid" style={{marginTop:12}}>
            {Object.entries(cert.values||{}).map(([k,v])=>{
              const lbl=(ct?.labels||[]).find(l=>l.key===k);
              const dv = lbl?.type==='date' ? fmtDate(v) : v;
              return(<div className="verify-field" key={k}><div className="verify-field-lbl">{k.replace(/_/g,' ')}</div><div className="verify-field-val">{dv||'—'}</div></div>);
            })}
          </div>
          <div style={{textAlign:'center',fontSize:9.5,color:'var(--tx3)',marginTop:10}}>Certificate ID: {cert.certId}<br/>Issued: {new Date(cert.createdAt).toLocaleDateString()} · Checked: {now.toLocaleString()}</div>
        </div>
      </div>
    </div>
  );
}

function BranchManagerModal({branches,onDone,onSave,fbOk,initialMode='select'}){

            <div>
              <div style={{fontSize:10,fontWeight:800,color:'var(--navy)',textTransform:'uppercase',letterSpacing:.5,marginBottom:8}}>New Branch Details</div>
              {[['Branch / Chapter Name *',newBranchName,setNewBranchName,'e.g. TWS Bihar State Chapter',true],['Branch Code for Certificate ID *',newBranchCode,setNewBranchCode,'e.g. BR',true],['City / Address (Line 2)',newBranchLine2,setNewBranchLine2,'e.g. Patna, Bihar',false],['Registration No. (Line 3)',newBranchLine3,setNewBranchLine3,'e.g. REG. NO. : 12345',false],['Founded (Line 4)',newBranchLine4,setNewBranchLine4,'e.g. ESTD : 1998',false],['First Year / Batch *',newSessionName,setNewSessionName,String(new Date().getFullYear()),false]].map(([lbl,val,setter,ph,req])=>(
                <div key={lbl} style={{marginBottom:8}}><div style={{fontSize:9,fontWeight:700,color:'var(--tx2)',textTransform:'uppercase',marginBottom:3}}>{lbl}</div><input className="f-input" style={{marginBottom:0}} placeholder={ph} value={val} onChange={e=>setter(e.target.value)} required={req}/></div>
              ))}
              <div style={{fontSize:9,color:'var(--tx3)',margin:'4px 0 6px',lineHeight:1.5}}>The branch code appears in every certificate ID, e.g. TWS/<strong>{newBranchCode.trim().toUpperCase()||'BR'}</strong>/{new Date().getFullYear()}/4821.</div>
              <button className="btn btn-navy" style={{width:'100%',fontSize:12,padding:10,marginTop:6}} onClick={createBranch} disabled={loading||!newBranchName.trim()}>{loading?'Creating…':'🏢 Create Branch & Continue →'}</button>
            </div>
          )}
          {mode==='select'&&canProceed&&(<>
            <div style={{background:'linear-gradient(135deg,#ecfdf5,#d1fae5)',border:'1.5px solid #10b981',borderRadius:8,padding:'10px 14px',marginBottom:14,fontSize:10}}>
              <div style={{fontWeight:800,color:'#065f46',marginBottom:2}}>✓ Ready</div>
              <div style={{color:'#047857'}}>Branch: <strong>{branch?.name}</strong> ({branch?.code||'BR'})</div>
              <div style={{color:'#047857'}}>Year / Batch: <strong>{selSession}</strong></div>
            </div>
            <button className="btn btn-navy" style={{width:'100%',fontSize:13,padding:10}} onClick={()=>onDone(selBranch,selSession,branch)}>🏅 Open Certificate Studio →</button>
          </>)}
        </div>
      </div>
    </div>
  );
}

/* ============================ APP ROOT ============================ */
function App(){
  const [tab,setTab]=useState('types');
  const [branchObj,setBranchObj]=useState(null);
  const [activeSession,setActiveSession]=useState(null);
  const [branchStatus,setBranchStatus]=useState('resolving');
  const [branches,setBranches]=useState([]);
  const [branchesLoaded,setBranchesLoaded]=useState(false);
  const [showSetup,setShowSetup]=useState(false);
  const [certTypes,setCertTypes]=useState([]);
  const [certificates,setCertificates]=useState([]);
  const [designId,setDesignId]=useState(null);
  const [showCreateType,setShowCreateType]=useState(false);
  const [fbStatus,setFbStatus]=useState('loading');
  const [viewingCert,setViewingCert]=useState(null);
  const [editingCert,setEditingCert]=useState(null);
  const [verifyCertId,setVerifyCertId]=useState(null);
  const [serviceBlocked,setServiceBlocked]=useState(null);

  const fbOk=fbStatus==='ok';
  const cdnConfigured = window.CLOUDINARY_CONFIG.cloudName && window.CLOUDINARY_CONFIG.cloudName!=='YOUR_CLOUD_NAME';
  const samePageVerifyUrl=(typeof window!=='undefined')? (window.location.origin+window.location.pathname) : '';
  const activeBranch = branchObj?.id || null;
  const branchCode = branchObj?.code || 'BR';
  const workerConfigured = !!(window.CERT_WORKER_CONFIG && window.CERT_WORKER_CONFIG.url && window.CERT_WORKER_CONFIG.url.trim());
  const verifyBaseUrl = workerConfigured ? `${window.CERT_WORKER_CONFIG.url.replace(/\/$/,'')}/verify` : samePageVerifyUrl;
  const verifyParam = workerConfigured ? 'id' : 'verify';

  useEffect(()=>{
    const params=new URLSearchParams(window.location.search);
    const v=params.get('verify');
    if(v) setVerifyCertId(v);
  },[]);

const handleSetupDone=useCallback((branchId,session,branch)=>{
    if(branch&&branch.services&&branch.services.certificate===false){
      setServiceBlocked({branchName:branch.name||'This branch'});
      return;
    }
    setBranchObj(branch);
    setActiveSession(session);
    setBranchStatus('ready');
    setShowSetup(false);
  },[]);

  const saveBranches=useCallback(async(updated)=>{
    setBranches(updated);
    if(fbOk&&window.fbSaveOneSchool){
      for(const s of updated){
        try{ await window.fbSaveOneSchool(s); }
        catch(e){ showToast(`Failed to save branch "${s.name}": `+e.message,'e'); }
      }
    }
  },[fbOk]);

useEffect(()=>{
    const handler=(e)=>{
      if(e.data&&e.data.type==='switchTab'){
        setTab(e.data.tab);
      }
    };
    window.addEventListener('message',handler);
    return()=>window.removeEventListener('message',handler);
  },[]);

  // Firebase connection lifecycle
  useEffect(()=>{
    const onReady=()=>setFbStatus('ok');
    const onErr=()=>setFbStatus('error');
    const onNC=()=>setFbStatus('notConfigured');
    if(window._fbReady===true) onReady();
    else{
      document.addEventListener('fbReady',onReady,{once:true});
      document.addEventListener('fbNotConfigured',onNC,{once:true});
      document.addEventListener('fbError',onErr,{once:true});
      setTimeout(()=>setFbStatus(s=>s==='loading'?'timeout':s),8000);
    }
  },[]);

  // Auto-load a branch: grabs the first branch found for this admin, unless
  // ?branch=/?branchId=/CERT_APP_CONFIG.branchId explicitly names one, in
  // which case that branch is used directly. With zero or multiple branches
  // the Branch Manager screen is shown so one can be picked/created.
  useEffect(()=>{
    const handler=(e)=>{
      const{email,schools,singleSchoolMode}=e.detail;
      setBranches(schools||[]);
      setBranchesLoaded(true);
      if(singleSchoolMode && schools && schools.length===1){
        const br=schools[0];
        const ses=(br.sessions&&br.sessions.length)?br.sessions[br.sessions.length-1]:'';
        if(ses) handleSetupDone(br.id,ses,br);
      } else {
        setShowSetup(true);
      }
    };
    document.addEventListener('adminEmailReady',handler);
    return()=>document.removeEventListener('adminEmailReady',handler);
  },[]);

  const loadBranchData=useCallback(async(branchId,session)=>{
    if(!branchId||!session||!fbOk)return;
    try{ const types=await window.fbLoadCertTypes(branchId,session); setCertTypes(types||[]); }catch(e){ console.warn(e); }
    try{ const certs=await window.fbLoadCertificates(branchId,session); setCertificates(certs||[]); }catch(e){ console.warn(e); }
  },[fbOk]);

  useEffect(()=>{ if(branchStatus==='ready'&&activeBranch&&activeSession) loadBranchData(activeBranch,activeSession); },[branchStatus,activeBranch,activeSession]);

  const createType=(ct)=>{
    setCertTypes(p=>[...p,ct]); setShowCreateType(false); setDesignId(ct.id); setTab('designer');
    if(fbOk&&window.fbSaveCertType) window.fbSaveCertType(ct,activeBranch,activeSession).catch(()=>showToast('Saved locally (Firebase save failed)','w'));
    showToast('Certificate type created ✓','s');
  };
  const replaceTypeImage=useCallback(async(id,file)=>{
    if(!file||!file.type.match(/image\//)){ showToast('Please choose an image file','e'); return; }
    const reader=new FileReader();
    reader.onload=async(e)=>{
      let img=e.target.result;
      const cloudReady=window.CLOUDINARY_CONFIG.cloudName&&window.CLOUDINARY_CONFIG.cloudName!=='YOUR_CLOUD_NAME';
      if(cloudReady){
        try{ img=await window.uploadToCloudinary(img, window.CLOUDINARY_CONFIG.folder+'/templates'); }
        catch(err){ showToast('Cloud upload failed, using local image: '+err.message,'w'); }
      }
      setCertTypes(prev=>{
        const updated=prev.map(c=>c.id===id?{...c,templateImage:img}:c);
        const changed=updated.find(c=>c.id===id);
        if(fbOk&&window.fbSaveCertType&&changed) window.fbSaveCertType(changed,activeBranch,activeSession).catch(er=>showToast('Auto-save failed: '+er.message,'w'));
        return updated;
      });
      showToast('Template image replaced — labels & positions kept ✓','s');
    };
    reader.readAsDataURL(file);
  },[fbOk,activeBranch,activeSession]);

  const updateType=useCallback((updated)=>{
    setCertTypes(prev=>prev.map(c=>c.id===updated.id?updated:c));
    if(fbOk&&window.fbSaveCertType) window.fbSaveCertType(updated,activeBranch,activeSession).catch((e)=>showToast('Auto-save failed: '+e.message,'w'));
  },[fbOk,activeBranch,activeSession]);
  const saveTypeToCloud=useCallback(async(ct)=>{
    if(!fbOk||!window.fbSaveCertType){ showToast('Firebase not connected — saved locally only','w'); return; }
    try{ await window.fbSaveCertType(ct,activeBranch,activeSession); showToast('Template saved to Firebase ☁️','s'); }
    catch(e){ showToast('Save failed: '+e.message,'e'); }
  },[fbOk,activeBranch,activeSession]);
  const deleteType=async(id)=>{
    if(!confirm('Delete this certificate type? Existing generated certificates keep their data (snapshot) but the template link is removed.')) return;
    setCertTypes(p=>p.filter(c=>c.id!==id));
    if(designId===id) setDesignId(null);
    if(fbOk&&window.fbDeleteCertType){
      try{
        await window.fbDeleteCertType(id,activeBranch,activeSession);
        showToast('Certificate type deleted ✓','s');
      }catch(e){
        showToast('Deleted locally — Firebase delete failed: '+e.message,'w');
      }
    }else{
      showToast('Deleted locally — Firebase not connected','w');
    }
  };
  const onGenerated=async(cert)=>{
    setCertificates(p=>[cert,...p]);
    if(fbOk&&window.fbSaveCertificate){
      try{
        await window.fbSaveCertificate(cert,activeBranch,activeSession);
        showToast(`Certificate saved to database ✓ — ${cert.certId}`,'s');
      }catch(e){
        showToast('Saved locally only (Firebase failed): '+e.message,'e');
      }
    } else {
      showToast('Firebase not connected — certificate exists only in this browser tab','w');
    }
  };
  const reloadCerts=async()=>{ if(!fbOk)return; try{ const certs=await window.fbLoadCertificates(activeBranch,activeSession); setCertificates(certs||[]); showToast('Reloaded ✓','s'); }catch(e){ showToast('Reload failed','e'); } };
  const deleteCert=async(certId)=>{
    if(!confirm('Delete this certificate record?'))return;
    setCertificates(p=>p.filter(c=>c.certId!==certId));
    if(fbOk&&window.fbDeleteCertificate){
      try{
        await window.fbDeleteCertificate(certId,activeBranch,activeSession);
        showToast('Certificate deleted ✓','s');
      }catch(e){
        showToast('Deleted locally — Firebase delete failed: '+e.message,'w');
      }
    }else{
      showToast('Deleted locally — Firebase not connected','w');
    }
  };

  const activeDesignType=certTypes.find(c=>c.id===designId);
  const fbLabel={loading:'Connecting…',timeout:'Timeout',notConfigured:'Not Configured',ok:'Connected',error:'Error'}[fbStatus]||fbStatus;
  const fbDot={loading:'spin',timeout:'err',notConfigured:'err',ok:'ok',error:'err'}[fbStatus];
  const existingCategories=[...new Set(certTypes.map(c=>c.listName).filter(Boolean))];

  if(showSetup || branchStatus!=='ready'){
    if(!branchesLoaded) return <BranchStatusScreen status="resolving"/>;
    return <BranchManagerModal branches={branches} onDone={handleSetupDone} onSave={saveBranches} fbOk={fbOk} initialMode='select'/>;
  }

  return(
    <div className="app">
      <div className="topbar">
        <div className="brand">
          <div className="brand-badge">🏅</div>
          <div>
            <h1>TWS Certificate Studio</h1>
            <p>Teachers Welfare Society</p>
          </div>
        </div>
        <div className="tabs">
          {[['types','🏅 Types'],['designer','🎨 Designer'],['create','➕ Create'],['history','📜 History']].map(([id,lbl])=>(
            <button key={id} className={`tab-btn${tab===id?' active':''}`} onClick={()=>setTab(id)}>{lbl}</button>
          ))}
        </div>
      </div>

      <div className="context-bar no-print">
        <span style={{fontSize:9,color:'rgba(255,255,255,.4)',fontWeight:700}}>🏢</span>
        <span style={{fontSize:10.5,fontWeight:700}}>{branchObj?.name} ({branchObj?.code||'BR'})</span>
        <button className="ctx-btn" onClick={()=>setShowSetup(true)}>⚙ Branches</button>
        {(branchObj?.sessions||[]).length>1 ? (<>
          <span style={{fontSize:9,color:'rgba(255,255,255,.4)',fontWeight:700,marginLeft:6}}>📅</span>
          <select className="ctx-sel" value={activeSession||''} onChange={e=>{const ses=e.target.value;setActiveSession(ses);setCertTypes([]);setCertificates([]);loadBranchData(activeBranch,ses);}}>
            {(branchObj?.sessions||[]).map(s=><option key={s} value={s}>{s}</option>)}
          </select>
        </>) : (
          <span style={{fontSize:9,color:'rgba(255,255,255,.4)',marginLeft:6}}>📅 {activeSession}</span>
        )}
        <div style={{fontSize:9,color:'rgba(255,255,255,.5)'}}>{certTypes.length} types · {certificates.length} certificates</div>
        <div className="fb-pill" style={{marginLeft:'auto'}}><div className={`fb-dot ${fbDot}`}/>🔥 Firebase: {fbLabel}</div>
        <div className="fb-pill"><div className={`fb-dot ${cdnConfigured?'ok':'err'}`}/>☁️ CDN: {cdnConfigured?'Connected':'Not Configured'}</div>
        <div className="fb-pill"><div className={`fb-dot ${workerConfigured?'ok':'err'}`}/>🔗 Verify Worker: {workerConfigured?'Connected':'Not Configured'}</div>
      </div>

      <div className="app-body">
        <div className="main">
          {tab==='types' && <TypesTab certTypes={certTypes} onOpenCreate={()=>setShowCreateType(true)} onSelectDesign={(id)=>{setDesignId(id);setTab('designer');}} onDelete={deleteType} onReplaceImage={replaceTypeImage}/>}
          {tab==='designer' && <DesignerTab certType={activeDesignType} certTypes={certTypes} onUpdate={updateType} onSaveCloud={saveTypeToCloud} onReplaceImage={replaceTypeImage} verifyBaseUrl={verifyBaseUrl} verifyParam={verifyParam} onBack={()=>setTab('types')}/>}
          {tab==='create' && <CreateTab certTypes={certTypes} branchCode={branchCode} onGenerated={onGenerated} fbOk={fbOk} verifyBaseUrl={verifyBaseUrl} verifyParam={verifyParam} onBack={()=>setTab('types')}/>}
          {tab==='history' && <HistoryTab certificates={certificates} certTypes={certTypes} fbOk={fbOk} onRefresh={reloadCerts} onView={setViewingCert} onEdit={setEditingCert} onDelete={deleteCert} verifyBaseUrl={verifyBaseUrl} verifyParam={verifyParam}/>}
        </div>
      </div>

      {showCreateType && <CreateTypeModal onClose={()=>setShowCreateType(false)} onCreated={createType} fbOk={fbOk} existingCategories={existingCategories}/>}
      {viewingCert && <ViewCertModal cert={viewingCert} certTypes={certTypes} onClose={()=>setViewingCert(null)} verifyBaseUrl={verifyBaseUrl} verifyParam={verifyParam}/>}
      {editingCert && <EditCertModal cert={editingCert} certTypes={certTypes} onClose={()=>setEditingCert(null)} onSaved={(updated)=>{ setCertificates(p=>p.map(c=>c.certId===updated.certId?updated:c)); setEditingCert(null); }} fbOk={fbOk} activeBranch={activeBranch} activeSession={activeSession} verifyBaseUrl={verifyBaseUrl} verifyParam={verifyParam}/>}
      {verifyCertId && <VerifyOverlay certId={verifyCertId} certTypes={certTypes} branchName={branchObj?.name} onClose={()=>{setVerifyCertId(null);window.history.replaceState({},'',window.location.pathname);}} fbOk={fbOk} activeBranch={activeBranch} activeSession={activeSession}/>}

      {serviceBlocked&&(
        <div className="modal-bg" style={{zIndex:5000}} onClick={()=>setServiceBlocked(null)}>
          <div className="modal" style={{maxWidth:440,textAlign:'center',position:'relative',padding:'34px 26px'}} onClick={e=>e.stopPropagation()}>
            <button onClick={()=>setServiceBlocked(null)} style={{position:'absolute',top:12,right:12,background:'rgba(194,59,59,.12)',border:'1px solid rgba(194,59,59,.3)',color:'#c23b3b',width:30,height:30,borderRadius:'50%',fontSize:15,fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>✕</button>
            <div style={{fontSize:54,marginBottom:12}}>🚫</div>
            <h3 style={{fontFamily:"'Cinzel',serif",fontSize:21,fontWeight:900,color:'var(--navy)',marginBottom:10}}>Service Blocked by Admin</h3>
            <p style={{fontSize:13,color:'var(--tx2)',lineHeight:1.7}}>
              The <strong>Certificate Studio</strong> for <strong>{serviceBlocked.branchName}</strong> has been suspended by the Super Admin.
            </p>
            <p style={{fontSize:11.5,color:'var(--tx2)',marginTop:10}}>Please contact your administrator to restore access.</p>
          </div>
        </div>
      )}

      <div style={{background:'var(--navy)',color:'rgba(255,255,255,.55)',textAlign:'center',padding:'6px',fontSize:9.5}} className="no-print">
        Teachers Welfare Society · Certificate Studio v1.0 · {branchObj?.name||''} {activeSession?`· ${activeSession}`:''}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

try{ window.parent.postMessage({type:'studioReady'}, '*'); }catch(e){}
</script>

<script>
window._adminEmail='';
window._singleSchoolMode=false;
window.addEventListener('message',function(e){
  if(e.data&&e.data.type==='setAdminEmail'){
    const newEmail=e.data.email||'';
    if(window._adminEmail===newEmail&&window._adminEmailReady)return;
    window._adminEmail=newEmail;
    window._adminEmailReady=true;
    window._singleSchoolMode=e.data.singleSchoolMode===true;
    const tryLoad=()=>{
      if(window.fbLoadSchools&&window._fbReady){
        window.fbLoadSchools(window._adminEmail).then(function(branches){
          if(window.fbSaveOneSchool&&branches&&branches.length){
            branches.forEach(function(s){
              if(!s.adminEmail&&window._adminEmail){
                window.fbSaveOneSchool({...s,adminEmail:window._adminEmail}).catch(()=>{});
              }
            });
          }
          document.dispatchEvent(new CustomEvent('adminEmailReady',{
            detail:{email:window._adminEmail,schools:branches||[],singleSchoolMode:window._singleSchoolMode}
          }));
        });
      } else {
        setTimeout(tryLoad,400);
      }
    };
    tryLoad();
  }
});
</script>
</body>
</html>

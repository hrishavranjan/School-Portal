<script>
/* =====================================================================
   TEACHERS WELFARE SOCIETY — CERTIFICATE STUDIO
   Adapted from the general Certificate Generator engine. Changes made:
   1) Certificate ID format is now  TWS/<BRANCH_CODE>/<CURRENT_YEAR>/<4-digit-random>
      e.g. TWS/BR/2026/4821  — year is read from the system clock automatically.
      <BRANCH_CODE> comes from the Branch you create (default "BR"), so this
      supports multiple state/district branches later if needed.
   2) Certificates are now FIXED to A4 paper. When creating a certificate
      TYPE you still choose "Horizontal" (A4 landscape) or "Vertical"
      (A4 portrait) — the canvas, PDF export and browser print all use the
      exact A4 pixel/mm size for whichever orientation you picked.
   3) Verification is meant to be handled by a SEPARATE Cloudflare Worker
      (worker.js) that you'll get in a follow-up. Leave WORKER_CONFIG.url
      blank for now and the app will verify certificates on this same page
      instead (fallback mode) — once you deploy the worker, just paste its
      URL below and QR codes will point there instead.
   4) Re-branded copy: "School" → "Branch / Chapter", "Session" → "Year / Batch".
   5) Firestore data now lives under a separate `twsBranches` collection so
      it never mixes with any other certificate/ID-card app you may run on
      the same Firebase project.
   Everything else (label editor, image upload + positioning, QR block
   positioning, bulk Excel generation, history, edit, print/PDF/PNG/WhatsApp
   export) works exactly like the original engine.
   ===================================================================== */

/* ============ CLOUDINARY (optional image hosting — put your own here) ============ */
window.CLOUDINARY_CONFIG = { cloudName:'dbqqvmkss', uploadPreset:'Student Cerificate', folder:'school-id-cards/teachers' };

/* ============ VERIFICATION WORKER (leave blank until your worker.js is deployed) ============ */
window.CERT_WORKER_CONFIG = { url: 'https://tws-cid.coex.workers.dev' };

/* ============ APP CONFIG ============
   branchId  -> the Firestore branch doc id this deployment belongs to.
                Leave blank to resolve it from the URL, e.g. ?branch=BRANCH_ID
   ==================================== */
window.CERT_APP_CONFIG = {
  branchId: ''
};
</script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
(function(){
  /* ⚠️ Put YOUR OWN Firebase project config here before deploying. */
  const firebaseConfig = {
    apiKey:"AIzaSyCKjBisAbjBrqLgMiIGVrXipypvpL1BLFw",
    authDomain:"id-card-studio-coex.firebaseapp.com",
    projectId:"id-card-studio-coex",
    storageBucket:"id-card-studio-coex.firebasestorage.app",
    messagingSenderId:"560739605567",
    appId:"1:560739605567:web:5ddc295d98c1627a732c8a"
  };
  window.uploadToCloudinary = async function(dataUrl, folder){
    const cfg = window.CLOUDINARY_CONFIG;
    if(!cfg.cloudName || cfg.cloudName==='YOUR_CLOUD_NAME') throw new Error('Cloudinary not configured.');
    const res = await fetch(dataUrl); const blob = await res.blob();
    const fd = new FormData(); fd.append('file', blob); fd.append('upload_preset', cfg.uploadPreset);
    if(folder||cfg.folder) fd.append('folder', folder||cfg.folder);
    const up = await fetch(`https://api.cloudinary.com/v1_1/${cfg.cloudName}/image/upload`,{method:'POST',body:fd});
    if(!up.ok){const e=await up.json().catch(()=>({}));throw new Error('Cloudinary upload failed: '+(e.error?.message||up.status));}
    const d = await up.json(); return d.secure_url;
  };
  const IS_CONFIGURED = firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith('YOUR_');
  window._fbConfigured = IS_CONFIGURED;
  if(!IS_CONFIGURED){ window._fbReady=false; document.dispatchEvent(new Event('fbNotConfigured')); }
  else{
    (async function init(){
      try{
        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        db.settings({ ignoreUndefinedProperties: true });
        const col = (p)=>db.collection(p);
        const doc = (p,id)=>db.collection(p).doc(id);

        // NOTE: top-level collection is `twsBranches` (not `schools`) so this
        // never collides with any other certificate/ID-card app on the same project.
        const colPath = (branchId,session,sub)=>`twsBranches/${encodeURIComponent(branchId)}/sessions/${encodeURIComponent(session)}/${sub}`;

        // ---- Branches (read-only here - provisioned by admin/backoffice) ----
        window.fbLoadSchoolById = async (branchId)=>{
          if(!branchId) return null;
          const id = branchId.replace(/[^\w]/g,'_');
          const snap = await doc('twsBranches',id).get();
          return snap.exists ? snap.data() : null;
        };
        window.fbLoadSchools = async (adminEmail)=>{
          if(adminEmail){
            const snap = await col('twsBranches').where('adminEmail','==',adminEmail).get();
            if(!snap.empty) return snap.docs.map(d=>d.data());
          }
          return [];
        };
        window.fbSaveOneSchool = async (branch)=>{
          const id = branch.id.replace(/[^\w]/g,'_');
          await doc('twsBranches',id).set({
            id:branch.id, name:branch.name, code:branch.code||'BR', sessions:branch.sessions||[],
            adminEmail: branch.adminEmail||'',
            line2:branch.line2||'', line3:branch.line3||'', line4:branch.line4||'',
            updatedAt:Date.now()
          },{merge:true});
        };

        // ---- Certificate Types (scoped to branch/session) ----
        window.fbSaveCertType = async (ct, branchId, session)=>{
          const id = ct.id.replace(/[^\w]/g,'_');
          const cp = colPath(branchId,session,'certTypes');
          await db.collection(cp).doc(id).set({...ct, updatedAt: Date.now()}, {merge:true});
        };
        window.fbLoadCertTypes = async (branchId, session)=>{
          const cp = colPath(branchId,session,'certTypes');
          const snap = await db.collection(cp).get();
          return snap.docs.map(d=>d.data());
        };
        window.fbDeleteCertType = async (id, branchId, session)=>{
          const cp = colPath(branchId,session,'certTypes');
          await db.collection(cp).doc(id.replace(/[^\w]/g,'_')).delete();
        };

        // ---- Certificates (generated instances, scoped to branch/session) ----
        window.fbSaveCertificate = async (cert, branchId, session)=>{
          const id = cert.certId.replace(/[^\w]/g,'_');
          const cp = colPath(branchId,session,'certificates');
          await db.collection(cp).doc(id).set({...cert, BRANCH_ID:branchId, SESSION:session, updatedAt: Date.now()}, {merge:true});
        };
        window.fbLoadCertificates = async (branchId, session)=>{
          const cp = colPath(branchId,session,'certificates');
          const snap = await db.collection(cp).orderBy('createdAt','desc').get().catch(async()=>await db.collection(cp).get());
          return snap.docs.map(d=>d.data());
        };
        window.fbDeleteCertificate = async (certId, branchId, session)=>{
          const cp = colPath(branchId,session,'certificates');
          await db.collection(cp).doc(certId.replace(/[^\w]/g,'_')).delete();
        };
        window.fbGetCertificateById = async (certId, branchId, session)=>{
          const cp = colPath(branchId,session,'certificates');
          const snap = await db.collection(cp).doc(certId.replace(/[^\w]/g,'_')).get();
          return snap.exists ? snap.data() : null;
        };
        // Global lookup across all branches/sessions (used when verify link has no active branch context)
                window.fbGetCertificateByIdGlobal = async (certId)=>{
          const snap = await db.collectionGroup('certificates').where('certId','==',certId).limit(1).get();
          if(snap.empty) return null;
          return snap.docs[0].data();
        };
        window.fbGetCertificateByShortCode = async (shortCode, branchId, session)=>{
          if(!branchId||!session) return null;
          const cp = colPath(branchId,session,'certificates');
          const snap = await db.collection(cp).where('shortCode','==',shortCode).limit(1).get();
          return snap.empty ? null : snap.docs[0].data();
        };
        window.fbGetCertificateByShortCodeGlobal = async (shortCode)=>{
          const snap = await db.collectionGroup('certificates').where('shortCode','==',shortCode).limit(1).get();
          if(snap.empty) return null;
          return snap.docs[0].data();
        };
        window._fbReady = true; document.dispatchEvent(new Event('fbReady'));
      }catch(e){ console.error('Firebase init error:', e); window._fbReady=false; window._fbInitError=e.message; document.dispatchEvent(new CustomEvent('fbError',{detail:e.message})); }
    })();
  }
})();
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#1c2430; --gold:#8f6a2e; --gold2:#c9a24d; --navy:#12233d; --deep:#0c1c31;
  --bg:#f2efe6; --bg2:#e9e2d1; --panel:#fffdf8;
  --tx:#241f14; --tx2:#5a5344; --tx3:#948a72;
  --bdr:#e1d8bd; --bdr2:#cdbf9a;
  --grn:#127a52; --red:#c23b3b; --org:#c07d1d; --purple:#6b3fa0;
}
body{font-family:'Raleway',sans-serif;background:linear-gradient(135deg,var(--bg),var(--bg2));color:var(--tx);min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--gold);border-radius:3px}
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ===== Top bar ===== */
.topbar{background:linear-gradient(120deg,var(--navy),var(--deep));color:#fff;display:flex;align-items:center;padding:0 18px;height:58px;flex-shrink:0;border-bottom:3px solid var(--gold);box-shadow:0 2px 14px rgba(0,0,0,.2);gap:10px}
.brand{display:flex;align-items:center;gap:11px}
.brand-badge{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--gold),#6e5220);display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 2px 8px rgba(143,106,46,.5)}
.brand h1{font-family:'Cinzel',serif;font-size:18px;font-weight:700;letter-spacing:1px;line-height:1.1}
.brand p{font-size:8.5px;color:rgba(255,255,255,.5);letter-spacing:2px;text-transform:uppercase;margin-top:2px}
.back-btn{width:34px;height:34px;border-radius:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.back-btn:hover{background:rgba(255,255,255,.22)}
.tabs{display:flex;gap:3px;margin-left:10px;flex:1}
.tab-btn{padding:8px 16px;border-radius:6px;font-size:11.5px;font-weight:700;cursor:pointer;border:none;background:rgba(255,255,255,.06);color:rgba(255,255,255,.6);font-family:'Raleway',sans-serif;letter-spacing:.4px;text-transform:uppercase;transition:all .2s}
.tab-btn:hover{background:rgba(255,255,255,.15);color:#fff}
.tab-btn.active{background:linear-gradient(135deg,var(--gold),#6e5220);color:#fff;box-shadow:0 2px 10px rgba(143,106,46,.4)}
.top-right{display:flex;align-items:center;gap:8px}
.fb-pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:4px 12px;font-size:9.5px;font-weight:700}
.fb-dot{width:7px;height:7px;border-radius:50%}
.fb-dot.ok{background:var(--grn);box-shadow:0 0 6px var(--grn)}
.fb-dot.err{background:var(--red);box-shadow:0 0 6px var(--red)}
.fb-dot.spin{background:var(--org);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ===== Context bar (branch / year) ===== */
.context-bar{background:linear-gradient(90deg,#081120,var(--navy));color:#fff;height:34px;display:flex;align-items:center;padding:0 16px;gap:8px;font-size:10px;border-bottom:1px solid rgba(255,255,255,.1);flex-shrink:0}
.ctx-sel{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;padding:3px 9px;border-radius:5px;font-size:10.5px;font-weight:700;font-family:'Raleway',sans-serif;cursor:pointer;outline:none}
.ctx-sel option{background:var(--navy);color:#fff}
.ctx-btn{padding:3px 9px;border-radius:5px;font-size:9.5px;font-weight:700;cursor:pointer;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font-family:'Raleway',sans-serif;transition:all .15s}
.ctx-btn:hover{background:rgba(255,255,255,.2)}
.context-bar .fb-pill{padding:2px 9px;font-size:8.5px;flex-shrink:0}

.app-body{display:flex;flex:1;overflow:hidden}
.main{flex:1;overflow-y:auto;padding:22px 26px}
.side{width:300px;min-width:300px;background:var(--panel);border-left:1px solid var(--bdr);overflow-y:auto;flex-shrink:0;box-shadow:-2px 0 14px rgba(0,0,0,.05)}
.side-hdr{background:linear-gradient(120deg,var(--navy),var(--deep));color:#fff;padding:11px 14px;font-size:10.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;border-bottom:3px solid var(--gold)}
.side-body{padding:10px}

.page-title{font-family:'Cinzel',serif;font-size:24px;font-weight:700;color:var(--navy);margin-bottom:4px}
.page-sub{color:var(--tx2);font-size:11.5px;margin-bottom:16px;line-height:1.6}

.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 15px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;border:none;transition:all .15s;white-space:nowrap;font-family:'Raleway',sans-serif;letter-spacing:.3px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-gold{background:linear-gradient(135deg,var(--gold),#6e5220);color:#fff;box-shadow:0 2px 8px rgba(143,106,46,.35)}.btn-gold:hover:not(:disabled){filter:brightness(1.1)}
.btn-navy{background:var(--navy);color:#fff}.btn-navy:hover:not(:disabled){background:#182a4d}
.btn-ghost{background:#fff;color:var(--navy);border:1.4px solid var(--bdr2)}.btn-ghost:hover:not(:disabled){background:#fbf6e8}
.btn-red{background:rgba(194,59,59,.1);color:var(--red);border:1px solid rgba(194,59,59,.28)}.btn-red:hover:not(:disabled){background:rgba(194,59,59,.2)}
.btn-grn{background:rgba(18,122,82,.1);color:var(--grn);border:1px solid rgba(18,122,82,.28)}.btn-grn:hover:not(:disabled){background:rgba(18,122,82,.2)}
.btn-wa{background:#25D366;color:#fff}.btn-wa:hover:not(:disabled){background:#1ebe58}
.btn-sm{padding:5px 10px;font-size:9.5px}
.btn-xs{padding:3px 7px;font-size:8.5px}

/* ===== Certificate Type cards (list) ===== */
.type-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.type-card{background:var(--panel);border:1.5px solid var(--bdr);border-radius:10px;overflow:hidden;cursor:pointer;transition:all .18s;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.type-card:hover{border-color:var(--gold);box-shadow:0 6px 22px rgba(143,106,46,.22);transform:translateY(-2px)}
.type-thumb{width:100%;height:130px;object-fit:cover;background:#ece3d0;display:block}
.type-info{padding:10px 12px}
.type-name{font-family:'Cinzel',serif;font-weight:700;font-size:13px;color:var(--navy);margin-bottom:2px}
.type-meta{font-size:9.5px;color:var(--tx3)}
.type-actions{display:flex;gap:5px;padding:0 12px 10px}
.add-type-card{border:2.5px dashed var(--bdr2);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:210px;cursor:pointer;color:var(--tx2);background:#fffdf6;transition:all .18s}
.add-type-card:hover{border-color:var(--gold);color:var(--gold)}
.add-type-card .aic{font-size:34px}

/* ===== Modals ===== */
.modal-bg{position:fixed;inset:0;background:rgba(10,8,3,.55);z-index:1000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);padding:20px}
.modal{background:var(--panel);border-radius:12px;padding:22px;max-width:640px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 24px 70px rgba(0,0,0,.35);border-top:4px solid var(--gold)}
.modal-hdr-row{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.modal-back{width:28px;height:28px;border-radius:6px;background:#fbf6e8;border:1px solid var(--bdr2);color:var(--navy);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modal-back:hover{background:var(--gold);color:#fff}
.modal h3{font-family:'Cinzel',serif;font-size:18px;font-weight:700;color:var(--navy);margin:0}
.f-lbl{font-size:10px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:4px}
.f-input,.f-select{width:100%;border:1.4px solid var(--bdr2);border-radius:6px;padding:8px 11px;font-size:12px;outline:none;font-family:'Raleway',sans-serif;background:#fff;margin-bottom:11px}
.f-input:focus,.f-select:focus{border-color:var(--gold)}
.upload-zone{border:2.5px dashed var(--bdr2);border-radius:10px;padding:30px 16px;text-align:center;cursor:pointer;background:#fffdf6;transition:all .2s;margin-bottom:12px}
.upload-zone:hover{border-color:var(--gold);background:#fbf5e4}
.upload-zone img{max-width:100%;max-height:160px;border-radius:6px;margin-bottom:8px}
.label-row{display:flex;gap:6px;align-items:center;margin-bottom:7px;background:#fbf6e8;border:1px solid var(--bdr);border-radius:7px;padding:7px 9px}
.label-row input[type=text]{flex:1;border:1px solid var(--bdr2);border-radius:5px;padding:5px 8px;font-size:11px;outline:none;font-family:'Raleway',sans-serif}
.label-row select{border:1px solid var(--bdr2);border-radius:5px;padding:5px 6px;font-size:10px;outline:none;font-family:'Raleway',sans-serif;background:#fff}
.label-row .lr-del{background:rgba(194,59,59,.12);border:1px solid rgba(194,59,59,.3);color:var(--red);border-radius:5px;width:24px;height:24px;cursor:pointer;font-size:11px;flex-shrink:0}
.chip-suggest{display:inline-flex;align-items:center;background:#fff;border:1px solid var(--bdr2);border-radius:20px;padding:4px 11px;font-size:9.5px;font-weight:700;color:var(--navy);margin:2px;cursor:pointer;transition:all .15s}
.chip-suggest:hover{background:var(--gold);color:#fff;border-color:var(--gold)}

/* ===== Certificate frame (rendered canvas) ===== */
.cert-outer{background:#e7ded0;border-radius:10px;padding:20px;overflow:auto}
.cert-frame{position:relative;background:#fff;box-shadow:0 8px 40px rgba(0,0,0,.22);margin:0 auto;overflow:hidden;border-radius:4px}
.cert-frame img.cert-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.cert-label{position:absolute;white-space:nowrap;z-index:5;user-select:none;cursor:pointer;padding:1px 4px;border-radius:3px;transition:box-shadow .12s}
.cert-label.selected{box-shadow:0 0 0 2px var(--purple),0 0 0 5px rgba(107,63,160,.15)}
.cert-label:hover{box-shadow:0 0 0 2px rgba(107,63,160,.4)}
.cert-qr-block{position:absolute;z-index:6;cursor:pointer;background:#fff;padding:3px;border-radius:4px;border:1px solid rgba(0,0,0,.12);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.cert-qr-block.selected{box-shadow:0 0 0 2px var(--purple)}
.cert-idtext{position:absolute;z-index:6;font-family:'Barlow Condensed',monospace;letter-spacing:.5px;cursor:pointer;padding:1px 4px;border-radius:3px}
.cert-idtext.selected{box-shadow:0 0 0 2px var(--purple)}
.cert-photo-block{position:absolute;z-index:6;cursor:pointer;overflow:hidden;border:1px solid rgba(0,0,0,.15);box-shadow:0 1px 4px rgba(0,0,0,.15);background:#f4efe4}
.cert-photo-block.selected{box-shadow:0 0 0 2px var(--purple)}
.cert-photo-block img{width:100%;height:100%;object-fit:cover;display:block}

/* ===== Designer sidebar blocks ===== */
.dz-sec{margin-bottom:8px;border:1px solid var(--bdr);border-radius:8px;overflow:hidden}
.dz-sec-hdr{padding:8px 11px;background:linear-gradient(90deg,#fbf6e8,#f4ecd6);font-size:10px;font-weight:800;color:var(--navy);letter-spacing:.4px;text-transform:uppercase}
.dz-sec-body{padding:10px;background:#fff}
.arr-btn{width:22px;height:22px;display:flex;align-items:center;justify-content:center;background:#fbf6e8;border:1px solid var(--bdr2);border-radius:4px;font-size:10px;font-weight:700;color:var(--navy);cursor:pointer;flex-shrink:0}
.arr-btn:hover{background:var(--gold);color:#fff;border-color:var(--gold)}
.arr-btn.rst{font-size:8px;width:20px;height:20px;background:#fdf0f0;border-color:#f0b8b8;color:var(--red)}
.arr-btn.rst:hover{background:var(--red);color:#fff}
.sld-row{display:flex;align-items:center;gap:4px;margin-bottom:5px}
.sld-lbl{font-size:9px;color:var(--tx2);font-weight:700;text-transform:uppercase;min-width:36px}
.sld-val{font-size:9px;color:var(--gold);font-weight:800;min-width:34px;text-align:right}
input[type=range]{flex:1;accent-color:var(--gold);height:3px;cursor:pointer}
input[type=color]{width:30px;height:22px;border:1px solid var(--bdr2);border-radius:4px;cursor:pointer;background:none;padding:1px}
.tog{position:relative;display:inline-block;width:30px;height:16px;flex-shrink:0}
.tog input{opacity:0;width:0;height:0}
.tog-sl{position:absolute;cursor:pointer;inset:0;background:#ccc;border-radius:16px;transition:.25s}
.tog-sl:before{content:'';position:absolute;height:10px;width:10px;left:3px;bottom:3px;background:white;border-radius:50%;transition:.25s}
input:checked+.tog-sl{background:var(--gold)}
input:checked+.tog-sl:before{transform:translateX(14px)}

/* ===== Form fields (create tab) ===== */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:780px;margin-bottom:14px}
.form-field label{font-size:10px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:4px}
.form-field input{width:100%;border:1.4px solid var(--bdr2);border-radius:6px;padding:8px 11px;font-size:12px;outline:none;font-family:'Raleway',sans-serif;background:#fff}
.form-field input:focus{border-color:var(--gold)}

/* ===== History / Gallery ===== */
.hist-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.hist-card{background:var(--panel);border:1.5px solid var(--bdr);border-radius:10px;padding:12px;transition:all .15s}
.hist-card:hover{border-color:var(--gold);box-shadow:0 4px 16px rgba(143,106,46,.15)}
.hist-name{font-family:'Cinzel',serif;font-weight:700;font-size:13.5px;color:var(--navy)}
.hist-meta{font-size:9.5px;color:var(--tx2);line-height:1.7;margin:5px 0 8px}
.hist-id{display:inline-block;background:#fbf6e8;border:1px solid var(--bdr2);border-radius:4px;padding:2px 7px;font-size:9px;font-family:monospace;color:var(--navy);font-weight:700}
.filter-bar{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.filter-bar input,.filter-bar select{background:#fff;border:1.3px solid var(--bdr2);border-radius:6px;color:var(--tx);padding:7px 10px;font-size:11px;outline:none;font-family:'Raleway',sans-serif}
.filter-bar input{flex:1;min-width:160px}
.cat-section{margin-bottom:26px}
.cat-hdr{display:flex;align-items:center;gap:8px;margin-bottom:11px;padding-bottom:7px;border-bottom:2px solid var(--bdr2)}
.cat-hdr h3{font-family:'Cinzel',serif;font-size:15px;font-weight:700;color:var(--navy)}
.cat-count{background:var(--gold);color:#fff;border-radius:20px;padding:1px 10px;font-size:10px;font-weight:800}

/* ===== Toast ===== */
.toast{display:flex;align-items:center;gap:7px;padding:9px 15px;border-radius:7px;font-size:11px;font-weight:700;min-width:200px;animation:tin .3s ease;box-shadow:0 4px 20px rgba(0,0,0,.2)}
.toast.s{background:#ecfdf5;border:1px solid var(--grn);color:#065f37}
.toast.e{background:#fef2f2;border:1px solid var(--red);color:#8f2020}
.toast.w{background:#fffbeb;border:1px solid var(--org);color:#7a5108}
.toast.i{background:#eff6ff;border:1px solid #2563eb;color:#1e40af}
@keyframes tin{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}

/* ===== Verify overlay ===== */
.verify-overlay{position:fixed;inset:0;background:rgba(8,6,3,.9);z-index:3000;display:flex;align-items:flex-start;justify-content:center;padding:24px;overflow-y:auto}
.verify-card{background:#fdfaf2;max-width:560px;width:100%;border-radius:14px;overflow:hidden;box-shadow:0 24px 90px rgba(0,0,0,.5);margin:auto;border-top:5px solid var(--gold)}
.verify-hdr{background:linear-gradient(120deg,var(--navy),var(--deep));padding:22px;text-align:center}
.verify-badge{display:inline-flex;align-items:center;gap:7px;background:linear-gradient(135deg,#0d5c3d,var(--grn));color:#fff;padding:7px 20px;border-radius:50px;font-size:12.5px;font-weight:800;letter-spacing:.6px;margin-bottom:10px;box-shadow:0 4px 16px rgba(18,122,82,.4)}
.verify-close{position:fixed;top:16px;right:16px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:16px;z-index:3001}
.verify-close:hover{background:rgba(255,255,255,.25)}
.verify-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.verify-field{background:#fff;border-radius:7px;padding:9px;border:1px solid var(--bdr)}
.verify-field-lbl{font-size:8.5px;font-weight:800;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.verify-field-val{font-size:12px;font-weight:700;color:var(--navy);font-family:'Cinzel',serif}
.verify-name-banner{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border:2px solid var(--grn);border-radius:9px;padding:14px;text-align:center;margin-top:12px}
.verify-name-banner .vnb-name{font-family:'Cinzel',serif;font-size:17px;font-weight:800;color:#065f37;margin-bottom:2px}
.verify-name-banner .vnb-sub{font-size:11px;color:#0d5c3d;font-weight:700}

/* ===== Branch loading / not-found screen ===== */
.setup-overlay{position:fixed;inset:0;background:linear-gradient(135deg,var(--navy),var(--deep));z-index:99998;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.setup-card{background:#fffdf8;border-radius:16px;width:100%;max-width:520px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.setup-hdr{background:linear-gradient(135deg,var(--navy),var(--deep));padding:22px;text-align:center;border-bottom:3px solid var(--gold)}
.setup-body{padding:26px;text-align:center}
.session-chip{display:inline-flex;align-items:center;background:#fbf6e8;border:1px solid var(--bdr2);border-radius:20px;padding:3px 10px;font-size:9px;font-weight:700;color:var(--navy);margin:2px;cursor:pointer;transition:all .15s}
.session-chip:hover{background:#f4ecd6}
.session-chip.active{background:var(--navy);color:#fff;border-color:var(--navy)}

.skel{height:60px;background:linear-gradient(90deg,#eee3c8 25%,#e0d5b4 50%,#eee3c8 75%);background-size:200%;animation:shim 1.4s infinite;border-radius:8px;margin-bottom:8px}
@keyframes shim{0%{background-position:200%}100%{background-position:-200%}}

#print-target{position:absolute;left:-99999px;top:0;pointer-events:none}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast-root" style="position:fixed;top:12px;right:12px;z-index:9999;display:flex;flex-direction:column;gap:6px;pointer-events:none"></div>

<script type="text/babel">
const {useState,useEffect,useRef,useMemo,useCallback,memo}=React;

/* ============================ CONSTANTS ============================ */
const FONTS=[
  {g:'Elegant Serif',items:[
    {l:'Playfair Display',v:"'Playfair Display',serif"},{l:'Cinzel',v:"'Cinzel',serif"},
    {l:'Cormorant Garamond',v:"'Cormorant Garamond',serif"},{l:'EB Garamond',v:"'EB Garamond',serif"},
    {l:'Marcellus',v:"'Marcellus',serif"},
  ]},
  {g:'Script / Signature',items:[
    {l:'Great Vibes',v:"'Great Vibes',cursive"},{l:'Dancing Script',v:"'Dancing Script',cursive"},
    {l:'Tangerine',v:"'Tangerine',cursive"},{l:'Sacramento',v:"'Sacramento',cursive"},
    {l:'Pacifico',v:"'Pacifico',cursive"},{l:'Caveat',v:"'Caveat',cursive"},
    {l:'Kalam',v:"'Kalam',cursive"},{l:'Satisfy',v:"'Satisfy',cursive"},
    {l:'Indie Flower',v:"'Indie Flower',cursive"},{l:'Permanent Marker',v:"'Permanent Marker',cursive"},
    {l:'Shadows Into Light',v:"'Shadows Into Light',cursive"},{l:'Allura',v:"'Allura',cursive"},
    {l:'Alex Brush',v:"'Alex Brush',cursive"},
  ]},
  {g:'Modern Sans',items:[
    {l:'Raleway',v:"'Raleway',sans-serif"},{l:'Barlow',v:"'Barlow',sans-serif"},
    {l:'Barlow Condensed',v:"'Barlow Condensed',sans-serif"},{l:'Poppins',v:"'Poppins',sans-serif"},
  ]},
  {g:'System',items:[
    {l:'Arial',v:"Arial,sans-serif"},{l:'Times New Roman',v:"'Times New Roman',serif"},
    {l:'Georgia',v:"Georgia,serif"},
  ]},
];
const ALL_FONTS=FONTS.flatMap(g=>g.items);
const SUGGESTED_LABELS=["Teacher Name","Father's / Husband's Name","School / Institution Name","Designation","District","Membership Number","Date of Joining","Years of Service","Award / Category"];
const DEFAULT_CATEGORIES=["Membership","Appreciation","Long Service","Excellence in Teaching","Retirement Honour","Merit","Participation","Honorary","Completion"];

const loadedFonts=new Set(['Raleway','Barlow','Barlow Condensed','Playfair Display','Cinzel','Cormorant Garamond','Great Vibes','Dancing Script','Poppins','Marcellus','EB Garamond','Tangerine','Sacramento']);
function ensureFontLoaded(fv){
  const name=fv.replace(/['"]/g,'').split(',')[0].trim();
  if(loadedFonts.has(name))return; loadedFonts.add(name);
  const slug=name.replace(/\s+/g,'+');
  const link=document.createElement('link'); link.rel='stylesheet';
  link.href=`https://fonts.googleapis.com/css2?family=${slug}:wght@400;700&display=swap`;
  document.head.appendChild(link);
}

function showToast(msg,type='i'){
  const c=document.getElementById('toast-root');
  const el=document.createElement('div'); el.className=`toast ${type}`;
  const ic={s:'✓',e:'✗',w:'⚠',i:'ℹ'}[type]||'ℹ';
  el.innerHTML=`<span style="font-size:14px">${ic}</span><span>${msg}</span>`;
  el.style.pointerEvents='all'; c.appendChild(el);
  setTimeout(()=>{el.style.animation='tin .3s reverse'; setTimeout(()=>el.remove(),280);},3200);
}

/* Certificate ID: TWS/<BRANCH_CODE>/<CURRENT_YEAR>/<4-digit-random>  e.g. TWS/BR/2026/4821 */
function genCertId(branchCode){
  const code=(branchCode||'BR').toUpperCase().replace(/[^A-Z0-9]/g,'')||'BR';
  const year=new Date().getFullYear();
  const num=String(Math.floor(1000+Math.random()*9000));
  return `TWS/${code}/${year}/${num}`;
}
/* Deterministic short code derived from certId — used ONLY for the QR payload
   so the QR stays small. The certificate ID itself is untouched everywhere else. */
function genShortCode(certId){
  let hash=0;
  for(let i=0;i<certId.length;i++){ hash=(hash*31 + certId.charCodeAt(i))|0; }
  hash=Math.abs(hash);
  return hash.toString(36).toUpperCase().padStart(5,'0').slice(-5);
}
function uid(prefix){ return `${prefix||'id'}_${Date.now()}_${Math.random().toString(36).slice(2,8)}`; }
function slugKey(label){ return label.toUpperCase().replace(/[^A-Z0-9]+/g,'_').replace(/^_|_$/g,'')||('FIELD_'+Math.random().toString(36).slice(2,5)); }
function fmtDate(iso){
  if(!iso) return '';
  const d=new Date(iso+'T00:00:00');
  if(isNaN(d)) return iso;
  const dd=String(d.getDate()).padStart(2,'0');
  const mm=String(d.getMonth()+1).padStart(2,'0');
  return `${dd}/${mm}/${d.getFullYear()}`;
}
async function waitForImagesLoaded(container, timeout=4000){
  const imgs = Array.from(container.querySelectorAll('img'));
  const start = Date.now();
  await Promise.all(imgs.map(img => new Promise(resolve=>{
    if(img.complete && img.naturalWidth>0) return resolve();
    const done=()=>resolve();
    img.addEventListener('load', done, {once:true});
    img.addEventListener('error', done, {once:true});
    setTimeout(done, Math.max(0, timeout-(Date.now()-start)));
  })));
}

/* A4 @ 96dpi, pixel-perfect so PDF/print need no rescaling */
const ORIENTATIONS={
  landscape:{w:1123,h:794},   // A4 landscape (297mm x 210mm)
  portrait:{w:794,h:1123},    // A4 portrait  (210mm x 297mm)
};

/* Injects/updates a single @page rule so browser Print always matches
   the certificate's own orientation (horizontal vs vertical), A4 only. */
function setPrintPageOrientation(orientation){
  const o = orientation==='portrait' ? 'portrait' : 'landscape';
  let style=document.getElementById('dynamic-print-style');
  if(!style){ style=document.createElement('style'); style.id='dynamic-print-style'; document.head.appendChild(style); }
  style.textContent = `
    @media print{
      @page{size:A4 ${o};margin:0}
      *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
      body *{visibility:hidden!important}
      #print-target, #print-target *{visibility:visible!important}
      html,body{background:#fff!important;height:auto!important;overflow:visible!important;margin:0!important}
      #print-target{display:block!important;position:fixed!important;top:0!important;left:0!important;width:100vw;height:100vh;margin:0;padding:0;overflow:hidden;z-index:99999}
      #print-target .cert-frame{margin:0!important;transform:scale(1);transform-origin:top left;}
    }
  `;
}

const DEFAULT_QR={show:true,x:0,y:0,size:70,position:'bottom-right'};
const DEFAULT_IDTEXT={show:true,x:0,y:0,fontSize:9,color:'#333333'};
const DEFAULT_PHOTO={show:false,x:0,y:0,w:110,h:130,position:'top-right',round:0,zoom:100,perCertificate:false};
const DEFAULT_ISSUE={show:true,x:0,y:0,fontSize:9,color:'#333333',showYearOnly:false};

function defaultLabelStyle(i){
  return {fontSize:16,fontFamily:ALL_FONTS[0].v,color:'#1c2430',bold:false,italic:false,align:'center',x:0,y:260+i*46,letterSpacing:0};
}

/* ============================ SMALL UI HELPERS ============================ */
function SliderRow({label,val,min,max,step=1,unit='',onChange,arrowStep}){
  const aStep=arrowStep||step;
  const clamp=v=>Math.min(max,Math.max(min,parseFloat((+v).toFixed(step<1?2:0))));
  return(
    <div style={{marginBottom:6}}>
      <div className="sld-row">
        <span className="sld-lbl">{label}</span>
        <button className="arr-btn" onClick={()=>onChange(clamp(val-aStep))}>◀</button>
        <input type="range" min={min} max={max} step={step} value={val} onChange={e=>onChange(clamp(e.target.value))}/>
        <button className="arr-btn" onClick={()=>onChange(clamp(val+aStep))}>▶</button>
        <span className="sld-val">{val}{unit}</span>
      </div>
    </div>
  );
}
function XY({x,y,onX,onY,min=-800,max=800,onReset}){
  const cl=(v)=>Math.min(max,Math.max(min,v));
  return(
    <div style={{marginBottom:6}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:3}}>
        <span style={{fontSize:9,fontWeight:800,color:'var(--navy)',textTransform:'uppercase'}}>Position</span>
        {onReset&&<button className="arr-btn rst" onClick={onReset}>↺</button>}
      </div>
      <div className="sld-row"><span className="sld-lbl">◀▶</span><button className="arr-btn" onClick={()=>onX(cl(x-1))}>◀</button><input type="range" min={min} max={max} value={x} onChange={e=>onX(cl(+e.target.value))}/><button className="arr-btn" onClick={()=>onX(cl(x+1))}>▶</button><span className="sld-val">{x}</span></div>
      <div className="sld-row"><span className="sld-lbl">▲▼</span><button className="arr-btn" onClick={()=>onY(cl(y-1))}>▲</button><input type="range" min={min} max={max} value={y} onChange={e=>onY(cl(+e.target.value))}/><button className="arr-btn" onClick={()=>onY(cl(y+1))}>▼</button><span className="sld-val">{y}</span></div>
    </div>
  );
}
function FontPick({value,onChange}){
  return(
    <select className="f-select" style={{marginBottom:6,fontFamily:value}} value={value} onChange={e=>{ensureFontLoaded(e.target.value);onChange(e.target.value);}}>
      {FONTS.map(g=>(<optgroup key={g.g} label={g.g}>{g.items.map(f=><option key={f.v} value={f.v} style={{fontFamily:f.v}}>{f.l}</option>)}</optgroup>))}
    </select>
  );
}

/* ============================ QR CODE ============================ */
const QRBox=memo(function QRBox({url,size}){
  const ref=useRef();
  useEffect(()=>{
    if(!ref.current||!url)return;
    ref.current.innerHTML='';
    try{ new QRCode(ref.current,{text:url,width:size,height:size,colorDark:'#000',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.H}); }
    catch(e){ console.warn('QR err',e); }
  },[url,size]);
  return <div ref={ref} style={{width:size,height:size}}/>;
});

/* ============================ CERTIFICATE RENDER ============================ */
const CertificateView=memo(function CertificateView({certType,values,certId,scale=1,selectedLabelId,onSelectLabel,verifyBaseUrl,verifyParam='verify',interactive=false,issueDate,teacherPhoto}){
  if(!certType) return null;
  const dim=ORIENTATIONS[certType.orientation||'landscape'];
  const W=dim.w*scale, H=dim.h*scale;
  const qr=certType.qr||DEFAULT_QR;
  const idt=certType.idText||DEFAULT_IDTEXT;
  const photo=certType.photo||DEFAULT_PHOTO;
  const iss=certType.issueDate||DEFAULT_ISSUE;
  const shortCode = certId ? genShortCode(certId) : '';
const verifyUrl = shortCode && verifyBaseUrl ? `${verifyBaseUrl.replace(/\/$/,'')}${verifyBaseUrl.includes('?')?'&':'?'}${verifyParam}=${shortCode}` : (shortCode?`#verify=${shortCode}`:'');
  const qrStyle={position:'absolute',zIndex:6};
  const qrSizePx=(qr.size||70)*scale;
  if((qr.position||'bottom-right')==='bottom-right'){ qrStyle.right=(14-(qr.x||0))*scale; qrStyle.bottom=(14+(qr.y||0))*scale; }
  else if(qr.position==='bottom-left'){ qrStyle.left=(14+(qr.x||0))*scale; qrStyle.bottom=(14+(qr.y||0))*scale; }
  else if(qr.position==='top-right'){ qrStyle.right=(14-(qr.x||0))*scale; qrStyle.top=(14+(qr.y||0))*scale; }
  else { qrStyle.left=(14+(qr.x||0))*scale; qrStyle.top=(14+(qr.y||0))*scale; }

  const photoStyle={position:'absolute',zIndex:6,width:(photo.w||110)*scale,height:(photo.h||130)*scale,borderRadius:(photo.round||0)*scale};
  if((photo.position||'top-right')==='top-right'){ photoStyle.right=(16-(photo.x||0))*scale; photoStyle.top=(16+(photo.y||0))*scale; }
  else if(photo.position==='top-left'){ photoStyle.left=(16+(photo.x||0))*scale; photoStyle.top=(16+(photo.y||0))*scale; }
  else if(photo.position==='bottom-right'){ photoStyle.right=(16-(photo.x||0))*scale; photoStyle.bottom=(16+(photo.y||0))*scale; }
  else { photoStyle.left=(16+(photo.x||0))*scale; photoStyle.bottom=(16+(photo.y||0))*scale; }

  return(
    <div className="cert-frame" style={{width:W,height:H}}>
      {certType.templateImage && <img className="cert-bg" src={certType.templateImage} alt="template" crossOrigin="anonymous"/>}
      {(certType.labels||[]).map(lb=>{
        const st=lb.style||defaultLabelStyle(0);
        let val=(values&&values[lb.key])||'';
        if(lb.type==='date' && val) val=fmtDate(val);
        const isSel=selectedLabelId===lb.id;
        return(
          <div key={lb.id}
            className={`cert-label${isSel?' selected':''}`}
            onClick={interactive?(e)=>{e.stopPropagation();onSelectLabel&&onSelectLabel(lb.id);}:undefined}
            style={{
              left:'50%', top:(st.y||0)*scale,
              transform:`translate(calc(-50% + ${(st.x||0)*scale}px),0)`,
              fontFamily:st.fontFamily||ALL_FONTS[0].v,
              fontSize:(st.fontSize||16)*scale,
              color:st.color||'#1c2430',
              fontWeight:st.bold?800:500,
              fontStyle:st.italic?'italic':'normal',
              textAlign:st.align||'center',
              letterSpacing:(st.letterSpacing||0)+'px',
              cursor:interactive?'pointer':'default'
            }}>{lb.type==='image' ? (
  val ? <img src={val} crossOrigin="anonymous" alt={lb.label} style={{width:(st.imgWidth||100)*scale,height:(st.imgHeight||100)*scale,objectFit:'cover',borderRadius:(st.imgRound||0)*scale,transform:`scale(${(st.imgZoom||100)/100})`}}/>
       : <div style={{width:(st.imgWidth||100)*scale,height:(st.imgHeight||100)*scale,background:'#f4efe4',display:'flex',alignItems:'center',justifyContent:'center',fontSize:9*scale,color:'#999'}}>{lb.label}</div>
) : (val || `{{${lb.label}}}`)}</div>
        );
      })}
            {idt.show!==false && certId && (
        <div className={`cert-idtext${selectedLabelId==='__idtext__'?' selected':''}`}
          onClick={interactive?(e)=>{e.stopPropagation();onSelectLabel&&onSelectLabel('__idtext__');}:undefined}
          style={{left:12+(idt.x||0)*scale,bottom:10+(-(idt.y||0))*scale,fontSize:(idt.fontSize||9)*scale,color:idt.color||'#333',cursor:interactive?'pointer':'default'}}>
          ID: {certId}
        </div>
      )}
      {iss.show!==false && issueDate && (
        <div className={`cert-idtext${selectedLabelId==='__issue__'?' selected':''}`}
          onClick={interactive?(e)=>{e.stopPropagation();onSelectLabel&&onSelectLabel('__issue__');}:undefined}
          style={{right:12-(iss.x||0)*scale,bottom:10+(-(iss.y||0))*scale,fontSize:(iss.fontSize||9)*scale,color:iss.color||'#333',cursor:interactive?'pointer':'default'}}>
          {iss.showYearOnly ? new Date(issueDate).getFullYear() : `Issued: ${fmtDate(issueDate)}`}
        </div>
      )}
      {qr.show!==false && (
        <div className={`cert-qr-block${selectedLabelId==='__qr__'?' selected':''}`} style={qrStyle}
          onClick={interactive?(e)=>{e.stopPropagation();onSelectLabel&&onSelectLabel('__qr__');}:undefined}>
          {verifyUrl ? <QRBox url={verifyUrl} size={qrSizePx}/> : <div style={{width:qrSizePx,height:qrSizePx,background:'#eee',display:'flex',alignItems:'center',justifyContent:'center',fontSize:9*scale,color:'#999'}}>QR</div>}
        </div>
      )}
      {photo.show && (
        <div className={`cert-photo-block${selectedLabelId==='__photo__'?' selected':''}`} style={photoStyle}
          onClick={interactive?(e)=>{e.stopPropagation();onSelectLabel&&onSelectLabel('__photo__');}:undefined}>
          {(()=>{
            const src = photo.perCertificate ? teacherPhoto : photo.image;
            if(src) return <img src={src} crossOrigin="anonymous" alt="photo" style={{width:'100%',height:'100%',objectFit:'cover',transform:`scale(${(photo.zoom||100)/100})`,transformOrigin:'center center'}}/>;
            return <div style={{width:'100%',height:'100%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:9*scale,color:'#999',background:'#f4efe4',textAlign:'center',padding:2}}>{photo.perCertificate?'Teacher Photo':'Photo'}</div>;
          })()}
        </div>
      )}
    </div>
  );
});

/* ============================ CREATE CERT-TYPE MODAL (upload + labels) ============================ */
function CreateTypeModal({onClose,onCreated,fbOk,existingCategories}){
  const [step,setStep]=useState(1); // 1 upload, 2 details+labels
  const [templateImage,setTemplateImage]=useState(null);
  const [name,setName]=useState('');
  const [listName,setListName]=useState(existingCategories[0]||DEFAULT_CATEGORIES[0]);
  const [orientation,setOrientation]=useState('landscape');
  const [labels,setLabels]=useState([{id:uid('lb'),label:'Teacher Name',key:'TEACHER_NAME',type:'text'}]);
  const [saving,setSaving]=useState(false);
  const fileRef=useRef();
  const allCats=[...new Set([...existingCategories,...DEFAULT_CATEGORIES])];

  const handleFile=async(f)=>{
    if(!f||!f.type.match(/image\//)){showToast('Please upload an image file','e');return;}
    const reader=new FileReader();
    reader.onload=e=>{ setTemplateImage(e.target.result); setStep(2); };
    reader.readAsDataURL(f);
  };
  const addLabel=(preset,type)=>{
    const lbl=preset||'New Field';
    setLabels(ls=>[...ls,{id:uid('lb'),label:lbl,key:slugKey(lbl)+'_'+ls.length,type:type||'text'}]);
  };
  const updateLabel=(id,txt)=>setLabels(ls=>ls.map(l=>l.id===id?{...l,label:txt,key:slugKey(txt)}:l));
  const updateLabelType=(id,type)=>setLabels(ls=>ls.map(l=>l.id===id?{...l,type}:l));
  const removeLabel=(id)=>setLabels(ls=>ls.filter(l=>l.id!==id));

  const create=async()=>{
    if(!name.trim()){showToast('Enter a certificate type name','w');return;}
    if(!listName.trim()){showToast('Enter or select a category','w');return;}
    if(!labels.length){showToast('Add at least one label','w');return;}
    setSaving(true);
    let img=templateImage;
    const cloudReady=window.CLOUDINARY_CONFIG.cloudName&&window.CLOUDINARY_CONFIG.cloudName!=='YOUR_CLOUD_NAME';
    if(cloudReady){ try{ img=await window.uploadToCloudinary(templateImage, window.CLOUDINARY_CONFIG.folder+'/templates'); }catch(e){ console.warn(e); } }
    const ct={
      id:uid('ctype'), name:name.trim(), listName:listName.trim(), orientation,
      templateImage:img,
      labels: labels.map((l,i)=>({id:l.id,label:l.label,key:l.key,type:l.type||'text',style:defaultLabelStyle(i)})),
            qr:{...DEFAULT_QR}, idText:{...DEFAULT_IDTEXT}, photo:{...DEFAULT_PHOTO}, issueDate:{...DEFAULT_ISSUE},
      createdAt:Date.now()
    };
    onCreated(ct);
    setSaving(false);
  };

  return(
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-hdr-row">
          {step===2 && <button className="modal-back" onClick={()=>setStep(1)}>←</button>}
          <h3>🏅 New Certificate Type — Step {step} of 2</h3>
        </div>
        {step===1 && (<>
          <div className="upload-zone" onClick={()=>fileRef.current.click()} onDragOver={e=>e.preventDefault()} onDrop={e=>{e.preventDefault();handleFile(e.dataTransfer.files[0]);}}>
            <div style={{fontSize:34,marginBottom:8}}>🖼️</div>
            <div style={{fontWeight:700,color:'var(--navy)',fontSize:13}}>Upload Certificate Template</div>
            <div style={{fontSize:10,color:'var(--tx2)',marginTop:4}}>PNG / JPG · Saved exactly as uploaded</div>
            <input ref={fileRef} type="file" accept="image/*" style={{display:'none'}} onChange={e=>handleFile(e.target.files[0])}/>
          </div>
          <div style={{display:'flex',justifyContent:'flex-end'}}><button className="btn btn-ghost" onClick={onClose}>Cancel</button></div>
        </>)}
        {step===2 && (<>
          <img src={templateImage} style={{width:'100%',maxHeight:160,objectFit:'contain',background:'#f4efe4',borderRadius:8,marginBottom:12}} alt=""/>
          <span className="f-lbl">Certificate Name (internal)</span>
          <input className="f-input" placeholder="e.g. TWS Long Service Honour 2026" value={name} onChange={e=>setName(e.target.value)}/>
          <span className="f-lbl">Certificate List / Category</span>
          <input className="f-input" list="cert-cat-list" placeholder="Type new or pick existing category…" value={listName} onChange={e=>setListName(e.target.value)}/>
          <datalist id="cert-cat-list">{allCats.map(c=><option key={c} value={c}/>)}</datalist>
          <span className="f-lbl">Orientation (fixed to A4)</span>
          <div style={{display:'flex',gap:6,marginBottom:6}}>
            {['landscape','portrait'].map(o=>(<button key={o} onClick={()=>setOrientation(o)} style={{flex:1,padding:'7px',fontSize:11,fontWeight:700,border:'1.4px solid',borderColor:orientation===o?'var(--gold)':'var(--bdr2)',background:orientation===o?'#fbf1d8':'#fff',color:orientation===o?'var(--navy)':'var(--tx2)',borderRadius:6,cursor:'pointer'}}>{o==='landscape'?'▭ Horizontal (A4 Landscape)':'▯ Vertical (A4 Portrait)'}</button>))}
          </div>
          <div style={{fontSize:9,color:'var(--tx3)',marginBottom:11}}>Your uploaded template image will be stretched to fit the chosen A4 orientation exactly — design your artwork at 1123×794px (horizontal) or 794×1123px (vertical) for a perfect fit.</div>

          <div style={{fontSize:11,fontWeight:800,color:'var(--navy)',textTransform:'uppercase',letterSpacing:.4,marginBottom:6}}>What does this certificate contain? (Labels)</div>
          <div style={{marginBottom:8}}>
            {SUGGESTED_LABELS.filter(s=>!labels.find(l=>l.label===s)).map(s=>(<span key={s} className="chip-suggest" onClick={()=>addLabel(s,'text')}>+ {s}</span>))}
            {!labels.find(l=>l.type==='date') && <span className="chip-suggest" style={{background:'#fbf1d8'}} onClick={()=>addLabel('Date','date')}>📅 + Date</span>}
          </div>
          {labels.map(l=>(
            <div className="label-row" key={l.id}>
              <input type="text" value={l.label} onChange={e=>updateLabel(l.id,e.target.value)} placeholder="Label name"/>
              <select value={l.type||'text'} onChange={e=>updateLabelType(l.id,e.target.value)}>
                <option value="text">Text</option>
                <option value="date">📅 Date</option>
                  <option value="image">🖼 Image (URL)</option>
              </select>
              <button className="lr-del" onClick={()=>removeLabel(l.id)}>✕</button>
            </div>
          ))}
          <button className="btn btn-ghost btn-sm" style={{marginBottom:14}} onClick={()=>addLabel()}>➕ Add Custom Label</button>

          <div style={{display:'flex',gap:8}}>
            <button className="btn btn-gold" style={{flex:1}} onClick={create} disabled={saving}>{saving?'Creating…':'✓ Create Certificate Type'}</button>
            <button className="btn btn-ghost" onClick={()=>setStep(1)}>← Back</button>
          </div>
        </>)}
      </div>
    </div>
  );
}

/* ============================ IMPORT LABELS MODAL ============================ */
function ImportLabelsModal({currentType,otherTypes,allTypes,onClose,onImport}){
  const [pickedId,setPickedId]=useState(otherTypes[0]?.id||'');
  const [mode,setMode]=useState('append'); // append | replace
  const picked=otherTypes.find(t=>t.id===pickedId);

  const templateNoOf=(t)=>{
    const src=allTypes||otherTypes;
    const sameCat=src.filter(x=>(x.listName||'Uncategorized')===(t.listName||'Uncategorized'));
    const idx=sameCat.findIndex(x=>x.id===t.id);
    return idx>=0?idx+1:1;
  };

  useEffect(()=>{
    if(picked) showToast(`Previewing Template ${templateNoOf(picked)} — ${picked.name} (${picked.listName})`,'i');
  },[pickedId]);

  const doImport=()=>{
    if(!picked){ showToast('Select a template to import from','w'); return; }
    const cloned=(picked.labels||[]).map((l,i)=>({
      ...l,
      id:uid('lb'),
      key: mode==='append' ? slugKey(l.label)+'_imp_'+Date.now()+'_'+i : l.key,
      style:{...l.style}
    }));
    onImport(cloned,mode);
    showToast(`Imported ${cloned.length} label${cloned.length!==1?'s':''} from "${picked.name}" ✓`,'s');
  };
  return(
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-hdr-row"><h3>⇪ Import Labels From Another Template</h3></div>
        {!otherTypes.length ? (
          <div style={{fontSize:11,color:'var(--tx2)',padding:'16px 0'}}>No other certificate templates exist yet in this branch/year to import from.</div>
        ) : (<>
          <span className="f-lbl">Source Template</span>
          <select className="f-select" value={pickedId} onChange={e=>setPickedId(e.target.value)}>
            {otherTypes.map(t=><option key={t.id} value={t.id}>{t.listName} — Template {templateNoOf(t)} ({t.name}) · {(t.labels||[]).length} labels</option>)}
          </select>
          {picked && (
            <div style={{display:'flex',flexWrap:'wrap',gap:5,margin:'8px 0 14px'}}>
              {(picked.labels||[]).map(l=>(<span key={l.id} className="chip-suggest" style={{cursor:'default'}}>{l.type==='date'?'📅 ':''}{l.label}</span>))}
            </div>
          )}
          <span className="f-lbl">Import Mode</span>
          <div style={{display:'flex',gap:6,marginBottom:14}}>
            <button onClick={()=>setMode('append')} style={{flex:1,padding:'7px',fontSize:11,fontWeight:700,border:'1.4px solid',borderColor:mode==='append'?'var(--gold)':'var(--bdr2)',background:mode==='append'?'#fbf1d8':'#fff',color:'var(--navy)',borderRadius:6,cursor:'pointer'}}>➕ Add to Current Labels</button>
            <button onClick={()=>setMode('replace')} style={{flex:1,padding:'7px',fontSize:11,fontWeight:700,border:'1.4px solid',borderColor:mode==='replace'?'var(--gold)':'var(--bdr2)',background:mode==='replace'?'#fbf1d8':'#fff',color:'var(--navy)',borderRadius:6,cursor:'pointer'}}>♻ Replace All Labels</button>
          </div>
          <div style={{fontSize:9.5,color:'var(--tx3)',marginBottom:14,lineHeight:1.5}}>After importing you can rename, restyle, reposition, add, or delete any label as usual in the panel on the right.</div>
          <div style={{display:'flex',gap:8}}>
            <button className="btn btn-gold" style={{flex:1}} onClick={doImport}>⇪ Import Labels</button>
            <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
          </div>
        </>)}
      </div>
    </div>
  );
}

/* ============================ BULK GENERATE MODAL (Excel) ============================ */
function BulkGenerateModal({certType,branchCode,verifyBaseUrl,verifyParam,onGenerated,onClose}){
  const [rows,setRows]=useState(null);
  const [processing,setProcessing]=useState(false);
  const [progress,setProgress]=useState({done:0,total:0});
  const [currentPreview,setCurrentPreview]=useState(null);
  const hiddenRef=useRef();
  const labels=certType?.labels||[];
  const [photoMap,setPhotoMap]=useState({});

  const downloadSample=()=>{
    if(!window.XLSX){ showToast('Excel engine still loading — try again in a moment','w'); return; }
    const headers=labels.map(l=>l.label);
    const sampleRow={};
    labels.forEach(l=>{ sampleRow[l.label] = l.type==='date' ? '15-01-2026' : (l.type==='image' ? 'photo1.jpg' : ''); });
    sampleRow['Issue Date']='15-01-2026';
const ws=XLSX.utils.json_to_sheet([sampleRow],{header:[...headers,'Issue Date']});
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'Certificates');
    XLSX.writeFile(wb,`${(certType.name||'certificate').replace(/[^\w-]+/g,'_')}_sample.xlsx`);
    const hasDate=labels.some(l=>l.type==='date');
    showToast(hasDate?'Sample downloaded ✓ — dates use DD-MM-YYYY (e.g. 15-01-2026)':'Sample Excel downloaded ✓','s');
  };

  const handleFile=(f)=>{
    if(!f) return;
    if(!window.XLSX){ showToast('Excel engine still loading — try again','w'); return; }
    const reader=new FileReader();
    reader.onload=(e)=>{
      try{
        const wb=XLSX.read(e.target.result,{type:'array'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const json=XLSX.utils.sheet_to_json(ws,{defval:''});
        if(!json.length){ showToast('That Excel sheet has no rows','w'); return; }
        const headerSet=Object.keys(json[0]);
        const missing=labels.filter(l=>!headerSet.includes(l.label));
        if(missing.length){ showToast(`Excel is missing column(s): ${missing.map(m=>m.label).join(', ')}`,'e'); return; }
        setRows(json);
        showToast(`Loaded ${json.length} row(s) from Excel ✓`,'s');
      }catch(err){ showToast('Could not read that Excel file: '+err.message,'e'); }
    };
    reader.readAsArrayBuffer(f);
  };

  const processRows=async()=>{
    if(!rows||!rows.length){ showToast('Upload a filled Excel file first','w'); return; }
    setProcessing(true); setProgress({done:0,total:rows.length});
    let ok=0, bad=0;

    for(let i=0;i<rows.length;i++){
      const row=rows[i]; const values={}; let rowMissing=false;
      for(const l of labels){
  if(l.type==='image'){
    const fname=String(row[l.label]??'').trim();
    let img=photoMap[fname]||'';
    if(img){
      const cloudReady=window.CLOUDINARY_CONFIG.cloudName&&window.CLOUDINARY_CONFIG.cloudName!=='YOUR_CLOUD_NAME';
      if(cloudReady){ try{ img=await window.uploadToCloudinary(img, window.CLOUDINARY_CONFIG.folder+'/photos'); }catch(e){} }
    }
    if(!img) rowMissing=true;
    values[l.key]=img;
    continue;
  }
  let v=String(row[l.label]??'').trim();
  if(l.type==='date' && v){
    if(!isNaN(v) && window.XLSX?.SSF){
      const d=XLSX.SSF.parse_date_code(Number(v));
      if(d) v=`${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;
    } else {
      const m=v.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/);
      if(m) v=`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
    }
  }
  if(!v) rowMissing=true;
  values[l.key]=v;
}

      if(rowMissing){ bad++; showToast(`Row ${i+2}: missing a value, skipped`,'w'); setProgress({done:i+1,total:rows.length}); continue; }

      let issueDate=String(row['Issue Date']??'').trim();
      if(issueDate){
        const m=issueDate.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/);
        issueDate = m ? `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}` : new Date().toISOString().slice(0,10);
      }else{
        issueDate=new Date().toISOString().slice(0,10);
      }

      const certId=genCertId(branchCode);
      setCurrentPreview({values,certId,issueDate});

      await new Promise(r=>setTimeout(r,60));

      let node=null;
      for(let t=0;t<20;t++){ node=hiddenRef.current?.querySelector('.cert-frame'); if(node) break; await new Promise(r=>setTimeout(r,50)); }

      let certImageUrl=null;
      if(node){
        try{
          await waitForImagesLoaded(node);
          const canvas=await html2canvas(node,{scale:2,useCORS:true,backgroundColor:'#ffffff'});
          const dataUrl=canvas.toDataURL('image/png');
          const cloudReady=window.CLOUDINARY_CONFIG.cloudName && window.CLOUDINARY_CONFIG.cloudName!=='YOUR_CLOUD_NAME';
          if(cloudReady){ try{ certImageUrl=await window.uploadToCloudinary(dataUrl, window.CLOUDINARY_CONFIG.folder+'/certificates'); }catch(e){} }
        }catch(e){}
      }

      const cert={
        certId, shortCode:genShortCode(certId), certTypeId:certType.id, certTypeName:certType.name, listName:certType.listName,
        values, createdAt:Date.now(), createdDate:new Date().toISOString().slice(0,10),
        issueDate, issueYear:new Date(issueDate).getFullYear(),
        snapshot:{templateImage:certType.templateImage, labels:certType.labels, qr:certType.qr, idText:certType.idText, photo:certType.photo, issueDate:certType.issueDate, orientation:certType.orientation},
        certImageUrl
      };

      try{ await onGenerated(cert); ok++; }
      catch(e){ bad++; showToast(`Row ${i+2}: save failed — ${e.message}`,'e'); }

      setProgress({done:i+1,total:rows.length});
    }

    setCurrentPreview(null); setProcessing(false);
    showToast(`Bulk generation done: ${ok} created${bad?`, ${bad} skipped/failed`:''} ✓`,'s');
  };

  return(
    <div className="modal-bg" onClick={processing?undefined:onClose}>
      <div className="modal" style={{maxWidth:560}} onClick={e=>e.stopPropagation()}>
        <div className="modal-hdr-row"><h3>📊 Bulk Generate Certificates</h3></div>
        {!certType ? (
          <div style={{fontSize:11,color:'var(--tx2)'}}>Select a certificate template first.</div>
        ) : (<>
          <div style={{fontSize:11,color:'var(--tx2)',marginBottom:12,lineHeight:1.6}}>
            Download the sample Excel for <strong>{certType.name}</strong>, fill one row per certificate, then upload it here.
            Columns must match: <strong>{labels.map(l=>l.label).join(', ')}</strong>, plus an optional <strong>Issue Date</strong> column (DD-MM-YYYY; defaults to today if left blank).
            {labels.some(l=>l.type==='date') && <><br/>Write dates as <strong>DD-MM-YYYY</strong> (e.g. 15-01-2026) — the sample sheet already shows this.</>}
          </div>
          <div style={{display:'flex',gap:8,marginBottom:14,flexWrap:'wrap'}}>
  <button className="btn btn-navy" onClick={downloadSample} disabled={processing}>⬇ Download Sample Excel</button>
  <label className="btn btn-ghost" style={{cursor:'pointer',margin:0}}>
    ⬆ Upload Filled Excel
    <input type="file" accept=".xlsx,.xls" style={{display:'none'}} onChange={e=>{handleFile(e.target.files[0]); e.target.value='';}} disabled={processing}/>
  </label>
  {labels.some(l=>l.type==='image') && (
    <label className="btn btn-ghost" style={{cursor:'pointer',margin:0}}>
      🖼 Upload Photos (select all)
      <input type="file" accept="image/*" multiple style={{display:'none'}} disabled={processing}
        onChange={async(e)=>{
          const files=[...e.target.files]; e.target.value='';
          const map={...photoMap};
          for(const f of files){
            map[f.name]=await new Promise(res=>{const r=new FileReader();r.onload=ev=>res(ev.target.result);r.readAsDataURL(f);});
          }
          setPhotoMap(map);
          showToast(`${files.length} photo(s) loaded — type the exact filename in the photo column`,'s');
        }}/>
    </label>
  )}
</div>
{Object.keys(photoMap).length>0 && <div style={{fontSize:10,color:'var(--tx2)',marginBottom:12}}>{Object.keys(photoMap).length} photo(s) ready: {Object.keys(photoMap).join(', ')}</div>}
          {rows && <div style={{fontSize:11,color:'var(--navy)',fontWeight:700,marginBottom:12}}>{rows.length} row(s) ready.</div>}
          {processing && (
            <div style={{marginBottom:12}}>
              <div style={{fontSize:11,fontWeight:700,color:'var(--navy)',marginBottom:5}}>Processing {progress.done} / {progress.total}…</div>
              <div style={{height:8,background:'#f4efe4',borderRadius:5,overflow:'hidden'}}>
                <div style={{height:'100%',background:'var(--gold)',width:`${(progress.done/Math.max(1,progress.total))*100}%`,transition:'width .2s'}}/>
              </div>
            </div>
          )}
          <div style={{display:'flex',gap:8}}>
            <button className="btn btn-gold" onClick={processRows} disabled={processing||!rows}>{processing?'Generating…':'🏅 Generate All'}</button>
            <button className="btn btn-ghost" onClick={onClose} disabled={processing}>Close</button>
          </div>
        </>)}
        {currentPreview && (
          <div style={{position:'absolute',left:-99999,top:0,pointerEvents:'none'}} ref={hiddenRef}>
            <CertificateView certType={certType} values={currentPreview.values} certId={currentPreview.certId} scale={1} verifyBaseUrl={verifyBaseUrl} verifyParam={verifyParam} issueDate={currentPreview.issueDate}/>
          </div>
        )}
      </div>
    </div>
  );
}

/* ============================ TYPES TAB ============================ */
function TypesTab({certTypes,onOpenCreate,onSelectDesign,onDelete,onReplaceImage}){
  const [collapsed,setCollapsed]=useState({});
  const toggleCat=(key)=>setCollapsed(p=>({...p,[key]:!p[key]}));
  const grouped=useMemo(()=>{
    const g={};
    certTypes.forEach(ct=>{
      const key=ct.listName||'Uncategorized';
      if(!g[key]) g[key]=[];
      g[key].push(ct);
    });
    return Object.entries(g).sort((a,b)=>a[0].localeCompare(b[0]));
  },[certTypes]);

  return(
    <div>
      <div className="page-title">Certificate Types</div>
      <div className="page-sub">Certificate types are grouped section-wise by category. Each section lists its templates (Template 1, Template 2…). All templates are fixed to A4 — choose Horizontal or Vertical when creating one. Click a template to design, replace its image, or delete it.</div>
      <div style={{marginBottom:16}}>
        <button className="btn btn-gold" onClick={onOpenCreate}>➕ Create New Type</button>
      </div>
      {!certTypes.length && <div style={{textAlign:'center',padding:'30px 0',color:'var(--tx3)',fontSize:11}}>No certificate types yet for this branch/year. Click "Create New Type" to get started.</div>}
      {grouped.map(([catName,types])=>{
        const isCollapsed=!!collapsed[catName];
        return(
          <div className="cat-section" key={catName}>
            <div className="cat-hdr" style={{cursor:'pointer'}} onClick={()=>toggleCat(catName)}>
              <span style={{fontSize:14,color:'var(--tx2)'}}>{isCollapsed?'▸':'▾'}</span>
              <h3 style={{flex:1}}>🏅 {catName}</h3>
              <span className="cat-count">{types.length} template{types.length!==1?'s':''}</span>
            </div>
            {!isCollapsed && (
              <div className="type-grid">
                {types.map((ct,i)=>(
                  <div className="type-card" key={ct.id}>
                    <img className="type-thumb" src={ct.templateImage} alt={ct.name} onClick={()=>onSelectDesign(ct.id)}/>
                    <div className="type-info" onClick={()=>onSelectDesign(ct.id)}>
                      <div className="type-name">Template {i+1} — {ct.name}</div>
                      <div className="type-meta">{(ct.labels||[]).length} labels · {ct.orientation==='portrait'?'Vertical (A4)':'Horizontal (A4)'}</div>
                    </div>
                    <div className="type-actions">
                      <button className="btn btn-navy btn-xs" onClick={()=>onSelectDesign(ct.id)}>🎨 Design</button>
                      <label className="btn btn-ghost btn-xs" style={{cursor:'pointer',margin:0}}>
                        🔁 Replace
                        <input type="file" accept="image/*" style={{display:'none'}} onChange={e=>{ if(e.target.files[0]) onReplaceImage(ct.id,e.target.files[0]); e.target.value=''; }}/>
                      </label>
                      <button className="btn btn-red btn-xs" onClick={()=>onDelete(ct.id)}>🗑</button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

/* ============================ DESIGNER TAB ============================ */
function DesignerTab({certType,certTypes,onUpdate,onSaveCloud,onReplaceImage,verifyBaseUrl,verifyParam,onBack}){
  const [selected,setSelected]=useState(null);
  const [zoom,setZoom]=useState(0.55);
  const [showImport,setShowImport]=useState(false);
  const photoRef=useRef();

  if(!certType) return (
    <div>
      <div className="page-sub">Select a certificate type from the "Types" tab first.</div>
      <button className="btn btn-ghost" onClick={onBack}>← Back to Types</button>
    </div>
  );

  const labels=certType.labels||[];
  const selLabel=labels.find(l=>l.id===selected);

  const updateLabelStyle=(id,patch)=>{
    onUpdate({...certType, labels: certType.labels.map(l=>l.id===id?{...l,style:{...l.style,...patch}}:l)});
  };
  const updateQr=(patch)=>onUpdate({...certType, qr:{...(certType.qr||DEFAULT_QR),...patch}});
  const updateIdText=(patch)=>onUpdate({...certType, idText:{...(certType.idText||DEFAULT_IDTEXT),...patch}});
  const updatePhoto=(patch)=>onUpdate({...certType, photo:{...(certType.photo||DEFAULT_PHOTO),...patch}});
  const updateIssue=(patch)=>onUpdate({...certType, issueDate:{...(certType.issueDate||DEFAULT_ISSUE),...patch}});
  const handlePhotoUpload=(f)=>{
    if(!f||!f.type.match(/image\//)){ showToast('Please choose an image file','e'); return; }
    const reader=new FileReader();
    reader.onload=async(e)=>{
      let img=e.target.result;
      const cloudReady=window.CLOUDINARY_CONFIG.cloudName&&window.CLOUDINARY_CONFIG.cloudName!=='YOUR_CLOUD_NAME';
      if(cloudReady){
        try{ img=await window.uploadToCloudinary(img, window.CLOUDINARY_CONFIG.folder+'/photos'); }
        catch(err){ showToast('Cloud upload failed, using local image: '+err.message,'w'); return; }
      }
      updatePhoto({image:img,show:true});
    };
    reader.readAsDataURL(f);
  };
  const addLabel=()=>{
    const lbl='New Field';
    const nl={id:uid('lb'),label:lbl,key:slugKey(lbl)+'_'+labels.length,type:'text',style:defaultLabelStyle(labels.length)};
    onUpdate({...certType, labels:[...labels,nl]});
    setSelected(nl.id);
  };
  const renameLabel=(id,txt)=>onUpdate({...certType, labels: labels.map(l=>l.id===id?{...l,label:txt,key:slugKey(txt)}:l)});
  const setLabelType=(id,type)=>onUpdate({...certType, labels: labels.map(l=>l.id===id?{...l,type}:l)});
  const deleteLabel=(id)=>{ onUpdate({...certType, labels: labels.filter(l=>l.id!==id)}); if(selected===id)setSelected(null); };

  const sampleValues=Object.fromEntries(labels.map(l=>[l.key, l.type==='date'?'2026-01-15':l.label]));

  return(
    <div style={{display:'flex',gap:16}}>
      <div style={{flex:1,minWidth:0}}>
        <div style={{display:'flex',alignItems:'center',gap:9,marginBottom:4}}>
          <button className="modal-back" onClick={onBack} title="Back to Types">←</button>
          <div className="page-title" style={{marginBottom:0}}>Designer — {certType.name}</div>
        </div>
        <div className="page-sub">Click any text, the photo box, or the QR block on the certificate to select & adjust it in the panel on the right. Orientation is fixed to A4 {certType.orientation==='portrait'?'Vertical':'Horizontal'}.</div>
        <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:12,flexWrap:'wrap'}}>
          <span style={{fontSize:10,color:'var(--tx2)'}}>Zoom</span>
          <button className="btn btn-ghost btn-xs" onClick={()=>setZoom(z=>Math.max(.3,+(z-.08).toFixed(2)))}>−</button>
          <span style={{fontSize:10,fontWeight:700}}>{Math.round(zoom*100)}%</span>
          <button className="btn btn-ghost btn-xs" onClick={()=>setZoom(z=>Math.min(1,+(z+.08).toFixed(2)))}>+</button>
          <button className="btn btn-ghost btn-sm" onClick={()=>setShowImport(true)}>⇪ Import Labels</button>
          <label className="btn btn-ghost btn-sm" style={{cursor:'pointer',margin:0}}>
            🔁 Replace Image
            <input type="file" accept="image/*" style={{display:'none'}} onChange={e=>{ if(e.target.files[0]&&onReplaceImage) onReplaceImage(certType.id,e.target.files[0]); e.target.value=''; }}/>
          </label>
          <label className="btn btn-ghost btn-sm" style={{cursor:'pointer',margin:0}}>
            🖼 {certType.photo?.image?'Replace Photo':'Add Photo Box'}
            <input ref={photoRef} type="file" accept="image/*" style={{display:'none'}} onChange={e=>{ if(e.target.files[0]) handlePhotoUpload(e.target.files[0]); e.target.value=''; }}/>
          </label>
          <button className="btn btn-gold btn-sm" onClick={addLabel}>➕ Add Label</button>
          <button className="btn btn-grn btn-sm" onClick={()=>onSaveCloud(certType)}>💾 Save Template</button>
        </div>
        <div className="cert-outer" onClick={()=>setSelected(null)}>
          <CertificateView certType={certType} values={sampleValues} certId="TWS/BR/2026/0000" scale={zoom} selectedLabelId={selected} onSelectLabel={setSelected} verifyBaseUrl={verifyBaseUrl} verifyParam={verifyParam} interactive={true} issueDate="2026-01-15" teacherPhoto={null}/>
        </div>
        <div style={{marginTop:14}}>
          <div style={{fontSize:11,fontWeight:800,color:'var(--navy)',textTransform:'uppercase',marginBottom:6}}>All Labels</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
            {labels.map(l=>(
              <div key={l.id} style={{display:'flex',alignItems:'center',gap:4,background:selected===l.id?'#fbf1d8':'#fff',border:'1px solid var(--bdr2)',borderRadius:20,padding:'4px 10px'}}>
                <span style={{fontSize:10,fontWeight:700,color:'var(--navy)',cursor:'pointer'}} onClick={()=>setSelected(l.id)}>{l.type==='date'?'📅 ':''}{l.label}</span>
                <button className="lr-del" style={{width:16,height:16,fontSize:8}} onClick={()=>deleteLabel(l.id)}>✕</button>
              </div>
            ))}
          </div>
        </div>
      </div>

      <div className="side" style={{position:'static',boxShadow:'none',borderLeft:'1px solid var(--bdr)'}}>
        <div className="side-hdr">⚙ Adjust</div>
        <div className="side-body">
          {!selected && <div style={{fontSize:11,color:'var(--tx3)',padding:'20px 6px',textAlign:'center'}}>Select a label, the ID text, the photo box, or the QR block on the certificate to adjust it here.</div>}

          {selLabel && (<div className="dz-sec">
            <div className="dz-sec-hdr">✏️ {selLabel.label}</div>
            <div className="dz-sec-body">
              <span className="f-lbl">Label Name</span>
              <input className="f-input" value={selLabel.label} onChange={e=>renameLabel(selLabel.id,e.target.value)}/>
              <span className="f-lbl">Field Type</span>
              <select className="f-select" value={selLabel.type||'text'} onChange={e=>setLabelType(selLabel.id,e.target.value)}>
                <option value="text">Text</option>
                <option value="date">📅 Date</option>
                  <option value="image">🖼 Image (URL)</option>
              </select>
              <XY x={selLabel.style.x||0} y={selLabel.style.y||0} onX={v=>updateLabelStyle(selLabel.id,{x:v})} onY={v=>updateLabelStyle(selLabel.id,{y:v})} onReset={()=>updateLabelStyle(selLabel.id,{x:0})}/>
{selLabel.type==='image' ? (<>
  <SliderRow label="Width" val={selLabel.style.imgWidth||100} min={30} max={320} onChange={v=>updateLabelStyle(selLabel.id,{imgWidth:v})} unit="px"/>
  <SliderRow label="Height" val={selLabel.style.imgHeight||100} min={30} max={320} onChange={v=>updateLabelStyle(selLabel.id,{imgHeight:v})} unit="px"/>
  <SliderRow label="Round" val={selLabel.style.imgRound||0} min={0} max={160} onChange={v=>updateLabelStyle(selLabel.id,{imgRound:v})} unit="px"/>
  <SliderRow label="Zoom" val={selLabel.style.imgZoom||100} min={50} max={300} onChange={v=>updateLabelStyle(selLabel.id,{imgZoom:v})} unit="%"/>
</>) : (
  <SliderRow label="Size" val={selLabel.style.fontSize||16} min={8} max={72} onChange={v=>updateLabelStyle(selLabel.id,{fontSize:v})} unit="px"/>
)}
              <SliderRow label="Spacing" val={selLabel.style.letterSpacing||0} min={-3} max={20} step={0.5} onChange={v=>updateLabelStyle(selLabel.id,{letterSpacing:v})} unit="px"/>
              <span className="f-lbl" style={{marginTop:6}}>Font Style</span>
              <FontPick value={selLabel.style.fontFamily||ALL_FONTS[0].v} onChange={v=>updateLabelStyle(selLabel.id,{fontFamily:v})}/>
              <div className="sld-row"><span className="sld-lbl">Color</span><input type="color" value={selLabel.style.color||'#1c2430'} onChange={e=>updateLabelStyle(selLabel.id,{color:e.target.value})}/></div>
              <div style={{display:'flex',gap:5,marginTop:6}}>
                <button className="btn btn-sm" style={{flex:1,background:selLabel.style.bold?'var(--navy)':'#f4efe4',color:selLabel.style.bold?'#fff':'var(--navy)'}} onClick={()=>updateLabelStyle(selLabel.id,{bold:!selLabel.style.bold})}><b>B</b></button>
                <button className="btn btn-sm" style={{flex:1,background:selLabel.style.italic?'var(--navy)':'#f4efe4',color:selLabel.style.italic?'#fff':'var(--navy)'}} onClick={()=>updateLabelStyle(selLabel.id,{italic:!selLabel.style.italic})}><i>I</i></button>
              </div>
              <span className="f-lbl" style={{marginTop:8}}>Align</span>
              <div style={{display:'flex',gap:4}}>{['left','center','right'].map(a=>(<button key={a} className="btn btn-sm" style={{flex:1,background:selLabel.style.align===a?'var(--navy)':'#f4efe4',color:selLabel.style.align===a?'#fff':'var(--navy)'}} onClick={()=>updateLabelStyle(selLabel.id,{align:a})}>{a[0].toUpperCase()}</button>))}</div>
            </div>
          </div>)}

          {selected==='__idtext__' && (<div className="dz-sec">
            <div className="dz-sec-hdr">🪪 Certificate ID Text</div>
            <div className="dz-sec-body">
              <div className="sld-row"><span className="sld-lbl">Show</span><label className="tog"><input type="checkbox" checked={certType.idText?.show!==false} onChange={e=>updateIdText({show:e.target.checked})}/><span className="tog-sl"/></label></div>
              <XY x={certType.idText?.x||0} y={certType.idText?.y||0} onX={v=>updateIdText({x:v})} onY={v=>updateIdText({y:v})} min={-800} max={800}/>
              <SliderRow label="Size" val={certType.idText?.fontSize||9} min={6} max={22} onChange={v=>updateIdText({fontSize:v})} unit="px"/>
              <div className="sld-row"><span className="sld-lbl">Color</span><input type="color" value={certType.idText?.color||'#333333'} onChange={e=>updateIdText({color:e.target.value})}/></div>
              <div style={{fontSize:9,color:'var(--tx3)',marginTop:4,lineHeight:1.5}}>Format is fixed: TWS/BRANCH/YEAR/#### — generated automatically for every certificate.</div>
            </div>
          </div>)}

          {selected==='__issue__' && (<div className="dz-sec">
            <div className="dz-sec-hdr">📅 Issue Date / Year</div>
            <div className="dz-sec-body">
              <div className="sld-row"><span className="sld-lbl">Show</span><label className="tog"><input type="checkbox" checked={certType.issueDate?.show!==false} onChange={e=>updateIssue({show:e.target.checked})}/><span className="tog-sl"/></label></div>
              <div className="sld-row"><span className="sld-lbl">Year only</span><label className="tog"><input type="checkbox" checked={!!certType.issueDate?.showYearOnly} onChange={e=>updateIssue({showYearOnly:e.target.checked})}/><span className="tog-sl"/></label></div>
              <XY x={certType.issueDate?.x||0} y={certType.issueDate?.y||0} onX={v=>updateIssue({x:v})} onY={v=>updateIssue({y:v})} min={-800} max={800}/>
              <SliderRow label="Size" val={certType.issueDate?.fontSize||9} min={6} max={22} onChange={v=>updateIssue({fontSize:v})} unit="px"/>
              <div className="sld-row"><span className="sld-lbl">Color</span><input type="color" value={certType.issueDate?.color||'#333333'} onChange={e=>updateIssue({color:e.target.value})}/></div>
            </div>
          </div>)}

          {selected==='__photo__' && (<div className="dz-sec">
            <div className="dz-sec-hdr">🖼 Photo Box</div>
            <div className="dz-sec-body">
              <div className="sld-row"><span className="sld-lbl">Show</span><label className="tog"><input type="checkbox" checked={certType.photo?.show===true} onChange={e=>updatePhoto({show:e.target.checked})}/><span className="tog-sl"/></label></div>
              <div className="sld-row"><span className="sld-lbl">Per-Cert</span><label className="tog"><input type="checkbox" checked={!!certType.photo?.perCertificate} onChange={e=>updatePhoto({perCertificate:e.target.checked})}/><span className="tog-sl"/></label></div>
              {certType.photo?.perCertificate ? (
                <div style={{fontSize:9,color:'var(--grn)',marginBottom:8,lineHeight:1.5}}>✓ Per-certificate mode — you'll upload a separate photo for each teacher when creating a certificate. Only position/size/shape are set here.</div>
              ) : (
                <label className="btn btn-ghost btn-sm" style={{cursor:'pointer',display:'block',textAlign:'center',marginBottom:8}}>
                  🔁 {certType.photo?.image?'Replace Image':'Upload Image'}
                  <input type="file" accept="image/*" style={{display:'none'}} onChange={e=>{ if(e.target.files[0]) handlePhotoUpload(e.target.files[0]); e.target.value=''; }}/>
                </label>
              )}
              <span className="f-lbl">Corner</span>
              <select className="f-select" value={certType.photo?.position||'top-right'} onChange={e=>updatePhoto({position:e.target.value})}>
                <option value="top-right">Top Right</option>
                <option value="top-left">Top Left</option>
                <option value="bottom-right">Bottom Right</option>
                <option value="bottom-left">Bottom Left</option>
              </select>
              <SliderRow label="Width" val={certType.photo?.w||110} min={40} max={320} onChange={v=>updatePhoto({w:v})} unit="px"/>
              <SliderRow label="Height" val={certType.photo?.h||130} min={40} max={320} onChange={v=>updatePhoto({h:v})} unit="px"/>
              <SliderRow label="Round" val={certType.photo?.round||0} min={0} max={160} onChange={v=>updatePhoto({round:v})} unit="px"/>
<SliderRow label="Zoom" val={certType.photo?.zoom||100} min={50} max={300} onChange={v=>updatePhoto({zoom:v})} unit="%"/>
              <XY x={certType.photo?.x||0} y={certType.photo?.y||0} onX={v=>updatePhoto({x:v})} onY={v=>updatePhoto({y:v})} onReset={()=>updatePhoto({x:0,y:0})}/>
